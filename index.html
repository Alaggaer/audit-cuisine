  download(new Blob([html], { type:"text/html" }), name);
  toast("Rapport téléchargé — envoyez-le par mail ou WhatsApp");
}
/* ---- Échanges avec le relais ----
   - une seule demande à la fois : un envoi automatique ne se mélange jamais avec une synchronisation ;
   - la réponse est vérifiée : si le relais répond autre chose que des données (page d'erreur de Google,
     réponse vide…), on réessaie une fois, puis on dit clairement ce qu'il a répondu ;
   - le dernier problème est gardé pour pouvoir être relu dans les réglages. */
let fileRelais = Promise.resolve();
function enFileRelais(tache){
  const p = fileRelais.then(tache);
  fileRelais = p.then(() => {}, () => {});
  return p;
}
// Début lisible de ce que le relais a répondu (sans les balises d'une page web)
function apercuReponse(txt){
  const t = String(txt == null ? "" : txt).replace(/<(style|script)[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&").replace(/\s+/g, " ").trim();
  return t ? "« " + t.slice(0, 180) + (t.length > 180 ? "…" : "") + " »" : "réponse vide";
}
function noterProblemeRelais(quoi, message){
  try{ localStorage.setItem("audit:dernierProbleme", JSON.stringify({ quand:Date.now(), quoi, message })); }catch(e){}
}
function dernierProblemeRelais(){
  try{
    const p = JSON.parse(localStorage.getItem("audit:dernierProbleme") || "null");
    return (estObjet(p) && typeof p.message === "string" && Date.now() - (p.quand || 0) < 7 * 86400000) ? p : null;
  }catch(e){ return null; }
}
async function appelRelais(quoi, url, options, delaiMax){
  let recu = "";
  for(let essai = 0; essai < 2; essai++){
    if(essai) await new Promise((r) => setTimeout(r, 1500));
    const ctl = (typeof AbortController === "function") ? new AbortController() : null;
    const garde = ctl ? setTimeout(() => ctl.abort(), delaiMax) : null;
    try{
      const resp = await fetch(url, ctl ? Object.assign({ signal:ctl.signal }, options) : options);
      recu = await resp.text();
    }catch(e){
      const err = new Error("Connexion au relais impossible (" + quoi + ")");
      err.reseau = true;
      noterProblemeRelais(quoi, err.message);
      throw err;
    }finally{ clearTimeout(garde); }
    try{ const data = JSON.parse(recu); if(estObjet(data)) return data; }catch(e){}
  }
  const err = new Error("Le relais a mal répondu (" + quoi + ") : " + apercuReponse(recu));
  noterProblemeRelais(quoi, err.message);
  throw err;
}
async function demanderAuRelais(quoi, url, options, delaiMax){
  const data = await enFileRelais(() => appelRelais(quoi, url, options, delaiMax));
  noterVersionRelais(data);
  if(data.erreur){
    const detail = typeof data.erreur === "string" ? data.erreur : JSON.stringify(data.erreur);
    const message = "Le relais a refusé (" + quoi + ") : " + String(detail).slice(0, 300);
    noterProblemeRelais(quoi, message);
    throw new Error(message);
  }
  return data;
}
// Demande sa version au relais (le relais 4.4 et les suivants la donnent ; les plus anciens ne connaissent pas cette demande)
async function verifierRelais(){
  actionCloudManuelle();
  const url = RELAIS_CLOUD + "?cle=" + encodeURIComponent(cleCloud()) + "&version=1&t=" + Date.now();   // jamais une réponse gardée en mémoire
  const data = await enFileRelais(() => appelRelais("vérification du relais", url, { cache:"no-store" }, 60000));
  if(typeof data.relais === "string"){ noterVersionRelais(data); return data.relais.slice(0, 20); }
  if(data.erreur === "cle invalide") throw new Error("le relais refuse la clé enregistrée dans les réglages");
  if(data.erreur){ try{ localStorage.setItem("audit:relaisVersion", "ancien"); }catch(e){} return "ancien"; }
  throw new Error("réponse inattendue du relais");
}
async function cloudPost(cle, audit){
  if(!audit || audit._resume) throw new Error("Audit incomplet (sans photos) : envoi refusé");
  const corps = JSON.stringify({ cle, audit });   // l'état de l'audit est figé ici, au moment de l'appel
  const reponse = await demanderAuRelais("envoi de l'audit « " + (audit.restaurant || "sans nom") + " »", RELAIS_CLOUD, { method:"POST", body: corps }, 300000);
  return { reponse, octets: corps.length };       // la taille envoyée sert plus tard à repérer un fichier tronqué sur le Drive
}

/* ---- Suivi des envois en ligne ----
   Un seul envoi à la fois par audit, et on retient quelle version est arrivée sur le Drive :
   le symbole ☁️ ne s'affiche que si la dernière modification y est bien. */
const envois = {};   // id → { enCours, minuterie, dernierEssai, echecs, echecReseau, echecSignale } (état de la session, non enregistré)
function etatEnvoi(id){ return envois[id] || (envois[id] = {}); }
function cleCloud(){ return reglages().cle || CLE_CLOUD_DEFAUT; }
function enLigneAJour(a){
  if(!a) return false;
  if(a.cloudVersion) return a.cloudVersion >= (a.updatedAt || 0);
  return !!a.cloudOk && a.cloudOk >= (a.updatedAt || 0);   // audit envoyé par une version précédente de l'app
}
function modifsNonEnvoyees(a){ return !!(a && (a.cloudVersion || a.cloudOk)) && !enLigneAJour(a); }
// Note, en mémoire et dans la base, que la version « version » de l'audit est sur le Drive
function marquerEnLigne(id, version, complet, debut, octets){
  const quand = Date.now();   // « debut » et « quand » encadrent l'envoi : ils servent à reconnaître notre propre fichier sur le Drive
  const pose = (a) => {
    if(!a || a.id !== id) return;
    a.cloudVersion = version; a.cloudDebut = debut || quand; a.cloudOk = quand; a.cloudDernier = quand; a.cloudComplet = !!complet;
    if(octets) a.cloudTaille = octets; else delete a.cloudTaille;
  };
  pose(current);
  cache.forEach(pose);
  try{ majCarteEnLigne(id); }catch(e){ console.error(e); }
  return dbMaj(id, pose);
}
/* Envoie l'audit complet au relais ; la promesse échoue si l'envoi échoue. */
async function envoyerAudit(audit){
  const e = etatEnvoi(audit.id);
  if(e.enCours) throw new Error("Un envoi de cet audit est déjà en cours");
  e.enCours = true; e.dernierEssai = Date.now();
  clearTimeout(e.minuterie); e.minuterie = null;
  const id = audit.id, version = audit.updatedAt || 0;
  const complet = estComplet(audit);
  try{
    const envoi = await cloudPost(cleCloud(), audit);
    e.echecs = 0; e.echecSignale = false;
    try{ localStorage.removeItem("audit:rattrapageEchec"); }catch(err){}   // le relais répond de nouveau : le rattrapage peut reprendre
    try{ await marquerEnLigne(id, version, complet, e.dernierEssai, envoi.octets); }catch(err){ console.error(err); }
    return { version, complet };
  }catch(err){
    e.echecs = (e.echecs || 0) + 1; e.echecReseau = !!err.reseau;
    throw err;
  }finally{
    e.enCours = false;
    try{ apresEnvoi(id); }catch(err){ console.error(err); }
  }
}
/* Après un envoi, réussi ou non : s'il reste des modifications qui ne sont pas en ligne, on programme la suite. */
function apresEnvoi(id){
  if(reglages().autoCloud === false) return;
  const a = (current && current.id === id) ? current : cache.find((x) => x.id === id);
  if(a && !enLigneAJour(a)) programmerEnvoi(a);
}
function programmerEnvoi(a){
  const e = etatEnvoi(a.id);
  if(e.enCours) return;                          // la suite sera décidée à la fin de l'envoi en cours
  const complet = estComplet(a);
  const intervalle = complet ? 60000 : 120000;   // au plus un envoi par minute (audit terminé) ou toutes les 2 min (audit en cours)
  let attente;
  if(e.echecs){                                  // après un échec : essais de plus en plus espacés
    const base = e.echecReseau ? intervalle : 900000;
    attente = Math.min(base * Math.pow(2, e.echecs - 1), 3600000) - (Date.now() - (e.dernierEssai || 0));
  } else if(complet && !a.cloudComplet){
    attente = 0;                                 // l'audit vient d'être terminé : la version finale part tout de suite
  } else {
    attente = Math.max(a.cloudDernier || 0, e.dernierEssai || 0) + intervalle - Date.now();
  }
  clearTimeout(e.minuterie);
  const id = a.id;
  e.minuterie = setTimeout(() => { e.minuterie = null; envoiAuto(id).catch(console.error); }, Math.max(0, attente));
}
// Envoi automatique d'un audit (ouvert ou non) dont la dernière version n'est pas en ligne
async function envoiAuto(id){
  if(reglages().autoCloud === false) return;
  const e = etatEnvoi(id);
  if(e.enCours) return;
  let audit = (current && current.id === id) ? current : null;
  if(!audit){
    if(aEnregistrer && aEnregistrer.id === id) await sauverMaintenant();
    audit = await dbGet(id);
    if(audit) assainir(audit);
  }
  if(!audit || audit._resume || enLigneAJour(audit) || e.enCours) return;
  try{
    const r = await envoyerAudit(audit);
    if(r.complet) toast("☁️ Audit complet sauvegardé dans votre Drive");
  }catch(err){
    if(!e.echecSignale && estComplet(audit)){
      e.echecSignale = true;
      toast("⚠️ Sauvegarde en ligne impossible pour l'instant — nouvel essai automatique plus tard");
    }
  }
}
// Appelé après chaque enregistrement local
function cloudAuto(audit){
  if(reglages().autoCloud === false || enLigneAJour(audit)) return;
  programmerEnvoi(audit);
}
/* À l'ouverture de l'app (ou au retour du réseau) : renvoie en arrière-plan les audits terminés
   dont la dernière version n'est pas sur le Drive (envoi interrompu, pas de réseau en cuisine…). */
let rattrapageEnCours = false;
let derniereActionCloud = 0;   // dernière action en ligne demandée par l'utilisateur : elle passe avant le rattrapage automatique
function actionCloudManuelle(){ derniereActionCloud = Date.now(); }
async function rattrapageEnLigne(){
  if(rattrapageEnCours || reglages().autoCloud === false || stockageHS || !db || navigator.onLine === false) return;
  if(Date.now() - derniereActionCloud < 120000) return;   // l'utilisateur vient de synchroniser, restaurer ou envoyer : on le laisse faire
  let blocage = 0;
  try{ blocage = Number(localStorage.getItem("audit:rattrapageEchec") || 0); }catch(e){}
  if(Date.now() - blocage < 6 * 3600000) return;   // le relais a refusé récemment : inutile d'insister
  rattrapageEnCours = true;
  const debut = Date.now();
  try{
    const aFaire = cache.filter((a) => a._resume && estComplet(a) && !enLigneAJour(a)).slice(0, 3);
    for(const r of aFaire){
      if(derniereActionCloud > debut) break;       // une action de l'utilisateur est arrivée entre-temps : on s'arrête là
      const e = etatEnvoi(r.id);
      if((current && current.id === r.id) || e.enCours || e.minuterie) continue;
      const audit = await dbGet(r.id);
      if(!audit || audit._resume || enLigneAJour(audit) || e.enCours) continue;
      try{ await envoyerAudit(assainir(audit)); }
      catch(err){
        if(!err.reseau){ try{ localStorage.setItem("audit:rattrapageEchec", String(Date.now())); }catch(e2){} }
        break;
      }
    }
  }finally{ rattrapageEnCours = false; }
}
async function cloudLister(){
  const cle = reglages().cle || CLE_CLOUD_DEFAUT;
  const data = await demanderAuRelais("liste des sauvegardes", RELAIS_CLOUD + "?cle=" + encodeURIComponent(cle) + "&sauvegardes=1", {}, 90000);
  return Array.isArray(data.audits) ? data.audits : [];
}
async function cloudCharger(id){
  const cle = reglages().cle || CLE_CLOUD_DEFAUT;
  const data = await demanderAuRelais("lecture d'un audit", RELAIS_CLOUD + "?cle=" + encodeURIComponent(cle) + "&charger=" + encodeURIComponent(id), {}, 240000);
  return data.audit;
}

/* ---------- Suivi : évolution / comparaison / groupe ---------- */
function renderSuivi(){
  if(!state.suiviResto){ const r = restosUniques(); state.suiviResto = r[0] || null; }
  const tab = state.suiviTab;
  // audits classiques et audits propreté sont suivis séparément : leurs scores ne portent pas sur les mêmes questions
  const avecProprete = cache.some(estProprete);
  const typeSuivi = (avecProprete && state.suiviType === "proprete") ? "proprete" : "classique";
  const lesAudits = cache.filter((a) => estProprete(a) === (typeSuivi === "proprete"));
  const chipsType = avecProprete ? `<div class="navrow">
    <button class="navchip ${typeSuivi === "classique" ? "active" : ""}" data-action="suivi-type" data-v="classique">📋 Audits classiques</button>
    <button class="navchip ${typeSuivi === "proprete" ? "active" : ""}" data-action="suivi-type" data-v="proprete">🧽 Audits propreté</button></div>` : "";
  let corps = "";
  const chipsRestos = restosUniques().map((r) =>
    `<button class="chip ${r === state.suiviResto ? "active" : ""}" data-action="suivi-resto" data-r="${esc(r)}">${esc(r)}</button>`).join("");

  if(tab === "evolution"){
    const tous = lesAudits.filter((a) => (a.restaurant || "").trim() === state.suiviResto).sort(parDate);
    const audits = tous.filter(auditTermine);   // seuls les audits terminés comptent dans les courbes
    const enCours = tous.length - audits.length;
    if(!tous.length){
      corps = `<div class="navrow">${chipsRestos}</div><div class="card"><div class="empty">Aucun audit${typeSuivi === "proprete" ? " propreté" : ""} pour ce restaurant.</div></div>`;
    } else {
      const serie = audits.map((a) => { const g = globalStats(a);
        return { label:dateCourt(a.date), val:g.score === null ? null : Math.round(g.score * 10) / 10 }; });
      const courbe = `<div class="card"><h3>Score global dans le temps</h3>${svgLigne(serie, (v) => Math.round(v) + " %")}
        ${enCours ? `<p class="meta" style="margin:8px 2px 0;">${enCours} audit(s) en cours : non compté(s) tant qu'ils ne sont pas terminés.</p>` : ""}</div>`;
      let delta = "";
      if(audits.length >= 2){
        const anc = audits[audits.length - 2], rec = audits[audits.length - 1];
        const gAnc = grilleDe(anc);
        const rows = grilleDe(rec).map((s) => {
          const sAnc = gAnc.find((x) => x.idx === s.idx);   // la même section dans l'audit précédent
          if(!sAnc) return "";
          const s1 = sectionStats(sAnc, anc).score, s2 = sectionStats(s, rec).score;
          if(s1 === null || s2 === null) return "";
          const d = s2 - s1;
          return `<div class="pl-item"><span style="flex:1;">${s.icon} ${esc(s.short)}</span>
            <span><b>${Math.round(s1)} %</b> → <b>${Math.round(s2)} %</b></span>
            <span class="${d >= 0 ? "up" : "down"}" style="font-weight:800;">${d >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(d))}</span></div>`;
        }).join("");
        delta = `<div class="card"><h3>Évolution par section</h3><p class="meta" style="margin:0 2px 8px;">${esc(fmtDate(anc.date))} → ${esc(fmtDate(rec.date))}</p>${rows}</div>`;
      }
      const liste = tous.map((a) => { const g = globalStats(a); const ic2 = interp(g.score); const fini = auditTermine(a);
        return `<div class="pl-item"><span style="flex:1;">${esc(fmtDate(a.date))}${a.suiviDe ? " 🔁" : ""}</span><span class="meta">${g.done}/${g.total} répondues</span>
          <span class="scorechip" style="background:${fini ? ic2.color : "#94a3b8"};">${!fini ? "en cours" : (g.score === null ? "—" : Math.round(g.score) + "%")}</span></div>`; }).join("");
      corps = `<div class="navrow">${chipsRestos}</div>` + courbe + delta +
        `<div class="card"><h3>${tous.length} audit(s) — ${esc(state.suiviResto || "")}</h3>${liste}</div>`;
    }
  }
  else if(tab === "comparaison"){
    const restos = restosUniques();
    // dernier audit terminé de chaque restaurant, d'après la date de l'audit (et non la date de dernière modification)
    const dernierScore = (r) => {
      const list = lesAudits.filter((a) => (a.restaurant || "").trim() === r && auditTermine(a)).sort(parDate);
      return list.length ? globalStats(list[list.length - 1]).score : null;
    };
    const barres = restos.map((r) => ({ label:r, val:dernierScore(r) === null ? null : Math.round(dernierScore(r)) }))
      .sort((a, b) => (b.val === null ? -1 : b.val) - (a.val === null ? -1 : a.val));
    corps = `<div class="card"><h3>Dernier score par restaurant</h3>${svgBarresH(barres, (v) => Math.round(v) + " %")}</div>
      <div class="card">${restos.map((r) => {
        const audits = lesAudits.filter((a) => (a.restaurant || "").trim() === r);
        const sc = dernierScore(r);
        const ic2 = interp(sc);
        return `<div class="pl-item" data-action="suivi-resto" data-r="${esc(r)}" style="cursor:pointer;">
          <span style="flex:1;">${esc(r)}</span><span class="meta">${audits.length} audit(s) · touchez pour l'évolution</span>
          <span class="scorechip" style="background:${ic2.color};">${sc === null ? "—" : Math.round(sc) + "%"}</span></div>`;
      }).join("")}</div>`;
  }
  else if(tab === "groupe"){
    const moisMap = {};
    lesAudits.forEach((a) => { const k = (a.date || "").slice(0, 7); if(k) moisMap[k] = true; });
    const mois = Object.keys(moisMap).sort().reverse();
    if(!state.grpMois || !mois.includes(state.grpMois)) state.grpMois = mois[0] || null;
    const chipsMois = mois.map((k) => {
      const d = new Date(k + "-01T12:00:00");
      return `<button class="chip ${k === state.grpMois ? "active" : ""}" data-action="grp-mois" data-k="${esc(k)}">${esc(d.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }))}</button>`;
    }).join("");
    const duMois = lesAudits.filter((a) => (a.date || "").slice(0, 7) === state.grpMois);
    const audits = duMois.filter(auditTermine);   // seuls les audits terminés comptent
    const enCours = duMois.length - audits.length;
    const scores = audits.map((a) => globalStats(a).score).filter((s) => s !== null);
    const moy = scores.length ? Math.round(scores.reduce((x, y) => x + y, 0) / scores.length) : null;
    const parResto = {};
    audits.slice().sort(parDate).forEach((a) => { parResto[(a.restaurant || "?").trim()] = a; });   // le plus récent du mois, par date d'audit
    const barres = Object.keys(parResto).map((r) => {
      const g = globalStats(parResto[r]);
      return { label:r, val:g.score === null ? null : Math.round(g.score) };
    }).sort((a, b) => (b.val === null ? -1 : b.val) - (a.val === null ? -1 : a.val));
    const faib = {};
    audits.forEach((a) => grilleDe(a).forEach((s) => {
      const st = sectionStats(s, a);
      if(st.non > 0) faib[s.short] = (faib[s.short] || 0) + st.non;
    }));
    const topFaibles = Object.keys(faib).map((k) => ({ label:k, val:faib[k] })).sort((a, b) => b.val - a.val).slice(0, 3);
    corps = `<div class="navrow">${chipsMois}</div>
      <div class="card"><h3>${audits.length} audit(s) terminé(s) — moyenne du mois : <span style="color:var(--brand);">${moy === null ? "—" : moy + " %"}</span></h3>
      ${svgBarresH(barres, (v) => Math.round(v) + " %")}
      ${enCours ? `<p class="meta" style="margin:8px 2px 0;">${enCours} audit(s) en cours : non compté(s) tant qu'ils ne sont pas terminés.</p>` : ""}</div>
      ${topFaibles.length ? `<div class="card"><h3>Points « Non » les plus fréquents du mois</h3>${svgBarresH(topFaibles, (v) => String(v))}</div>` : ""}`;
  }

  app.innerHTML = `
  <div class="topbar noprint"><div class="tb-in">
    <button class="tb-back" data-action="back-home">←</button>
    <div class="tb-title"><b>📊 Suivi des audits</b><small>${cache.length} audit(s) sur cet appareil</small></div>
  </div></div>
  <div class="chips noprint">
    <button class="chip ${tab === "evolution" ? "active" : ""}" data-action="suivi-tab" data-t="evolution">📈 Évolution</button>
    <button class="chip ${tab === "comparaison" ? "active" : ""}" data-action="suivi-tab" data-t="comparaison">🏆 Comparaison</button>
    <button class="chip ${tab === "groupe" ? "active" : ""}" data-action="suivi-tab" data-t="groupe">👥 Groupe</button>
  </div>
  <div class="wrap">${chipsType}${corps}</div>`;
  ajusterBarres();
  window.scrollTo(0, 0);
}

let annCv = null, annCtx = null, annBase = null, annOutil = "stylo", annTraits = [], annTrace = null;
let annEchelle = 1;   // pixels de la photo par pixel d'écran : les traits gardent la même épaisseur à l'écran
function annRedessiner(){
  annCtx.clearRect(0, 0, annCv.width, annCv.height);
  annCtx.drawImage(annBase, 0, 0, annCv.width, annCv.height);
  const tout = annTrace ? annTraits.concat([annTrace]) : annTraits;
  for(const t of tout){
    if(t.outil === "surligne"){
      annCtx.strokeStyle = "rgba(255,214,10,.45)";
      annCtx.lineWidth = 30 * annEchelle;
    } else {
      annCtx.strokeStyle = "#dc2626";
      annCtx.lineWidth = 5 * annEchelle;
    }
    annCtx.lineCap = "round"; annCtx.lineJoin = "round";
    const pts = t.points;
    if(pts.length < 2){
      annCtx.beginPath();
      annCtx.arc(pts[0].x, pts[0].y, (t.outil === "surligne" ? 15 : 3) * annEchelle, 0, 7);
      annCtx.fillStyle = annCtx.strokeStyle;
      annCtx.fill();
      continue;
    }
    annCtx.beginPath();
    annCtx.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++) annCtx.lineTo(pts[i].x, pts[i].y);
    annCtx.stroke();
    if(t.outil === "fleche" && pts.length >= 2){
      const p1 = pts[pts.length - 2], p2 = pts[pts.length - 1];
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const L = 24 * annEchelle;
      annCtx.beginPath();
      annCtx.moveTo(p2.x, p2.y);
      annCtx.lineTo(p2.x - L * Math.cos(ang - 0.45), p2.y - L * Math.sin(ang - 0.45));
      annCtx.lineTo(p2.x - L * Math.cos(ang + 0.45), p2.y - L * Math.sin(ang + 0.45));
      annCtx.closePath();
      annCtx.fillStyle = annCtx.strokeStyle;
      annCtx.fill();
    }
  }
}
function openAnnotateur(qid, i){
  const p = current.photos[qid][i];
  overlay.innerHTML = `<div class="viewer">

      <button class="outil" data-action="ann-outil" data-t="surligne">🟡 Surligneur</button>

    <p style="color:#cbd5e1; font-size:12.5px; margin:8px 0 0;">Stylo rouge libre · Flèche : glissez vers le défaut · Surligneur : passez sur la DLC sans la masquer</p>

    </div></div>`;
  overlay.style.display = "block";
  annCv = document.getElementById("annCv");
  annCtx = annCv.getContext("2d");
  annTraits = []; annTrace = null; annOutil = "stylo";
  const img = new Image();
  img.onload = () => {
    // On dessine à la taille réelle de la photo ; seul l'affichage est réduit (règle CSS de #annCv).
    // Avant, la photo était ramenée à la largeur de l'écran : annoter la rendait presque illisible.
    annCv.width = Math.max(1, img.naturalWidth);
    annCv.height = Math.max(1, img.naturalHeight);
    const largeurAffichee = annCv.getBoundingClientRect().width;
    annEchelle = largeurAffichee > 0 ? Math.max(1, annCv.width / largeurAffichee) : 1;
    annBase = img;
    annRedessiner();
    annCv.onpointerdown = (e) => {
      const pt = posSur(annCv, e);
      if(annOutil === "fleche") annTrace = { outil:"fleche", points:[pt, pt] };
      else annTrace = { outil:annOutil, points:[pt] };
      try{ annCv.setPointerCapture(e.pointerId); }catch(err){}
      annRedessiner();
    };
    annCv.onpointermove = (e) => {
      if(!annTrace) return;
      const pt = posSur(annCv, e);
      if(annTrace.outil === "fleche") annTrace.points = [annTrace.points[0], pt];
      else annTrace.points.push(pt);
      annRedessiner();
    };
    annCv.onpointerup = (e) => {
      if(!annTrace) return;
      if(annTrace.outil === "fleche") annTrace.points = [annTrace.points[0], posSur(annCv, e)];
      annTraits.push(annTrace);
      annTrace = null;
      annRedessiner();
    };
  };
  img.src = p;
}
function nomAudit(a){ return (enTexte(a.restaurant, 80) || "Audit sans nom") + (a.date ? " du " + fmtDate(enTexte(a.date, 40)) : ""); }
/* Synchronisation complète. « surEtape » reçoit un texte d'avancement. Un audit qui pose problème n'arrête pas
   les autres : il est listé dans « echecs ». Seule une coupure de connexion interrompt tout. */
async function cloudToutSynchro(surEtape){
  const etape = (t) => { try{ if(surEtape) surEtape(t); }catch(e){} };
  actionCloudManuelle();
  await sauverMaintenant();
  etape("Lecture de la liste du Drive…");
  const distants = dedoublonner(await cloudLister());
  const tombes = supprimes(), vuesAvant = majVues(), vues = {};
  const disparusAvant = disparusDrive(), disparus = {};
  const verifiesAvant = verifiesDrive(), verifies = {};
  let pousses = 0, importes = 0, illisibles = 0, repares = 0, nouveauxDisparus = 0, termine = false;
  const echecs = [];
  const locaux = {}, dejaTraites = {};
  cache.forEach((a) => locaux[a.id] = a);
  // Envoi d'un audit de cet appareil (toujours l'audit complet, jamais la copie sans photos de la liste) ; vrai s'il est parti
  const envoyer = async (a) => {
    if(etatEnvoi(a.id).enCours) return false;          // un envoi automatique de cet audit est déjà en route
    const complet = await chargerComplet(a.id);
    if(!complet){ illisibles++; return false; }
    try{ await envoyerAudit(complet); return true; }
    catch(err){
      if(err.reseau) throw err;                        // plus de connexion : inutile d'insister
      echecs.push("Envoi — " + nomAudit(a) + " : " + err.message);
      return false;
    }
  };
  try{
    // 1) Envoi : ce qui n'est pas sur le Drive, ou qui a été modifié ici depuis le dernier envoi
    const aEnvoyer = cache.slice().filter((a) => {
      const dist = distants.find((x) => x.id === a.id);
      const majDist = dist ? Date.parse(dist.maj) || 0 : 0;
      return !dist || (a.updatedAt || 0) > majDist || modifsNonEnvoyees(a);
    });
    let n = 0;
    for(const a of aEnvoyer){
      n++;
      dejaTraites[a.id] = true;
      etape("Envoi " + n + " / " + aEnvoyer.length + " — " + nomAudit(a));
      if(await envoyer(a)) pousses++;
    }
    // 2) Réception : ce qui manque ici, ou que le Drive a en plus récent, sans jamais écraser des modifications non envoyées
    const aRecevoir = [];
    for(const e of distants){
      if(dejaTraites[e.id]) continue;
      const loc = locaux[e.id];
      const majDist = Date.parse(e.maj) || 0;
      if(!loc){
        if(tombes[e.id] && majDist <= tombes[e.id]) continue;   // supprimé sur cet appareil, et pas modifié ailleurs depuis
        // déjà constaté : la liste du Drive cite ce fichier, mais il n'existe plus
        if(estDisparu(disparusAvant, e)){ disparus[e.id] = disparusAvant[e.id]; continue; }
      } else {
        if(modifsNonEnvoyees(loc)) continue;
        // ce fichier précis du Drive a déjà été relu avec succès par cet appareil
        const dejaRelu = verifiesAvant[e.id] !== undefined && verifiesAvant[e.id] === repereDrive(e);
        if(dejaRelu) verifies[e.id] = verifiesAvant[e.id];
        // Fichier peut-être incomplet : signalé par le relais (« abime », relais 4.4), vide, ou bien plus petit
        // que ce que cet appareil y a envoyé. On le relit pour vérifier, même si rien d'autre n'a changé.
        const douteux = !dejaRelu && (e.abime === true || e.taille === 0 || (!!loc.cloudTaille && typeof e.taille === "number" && e.taille < 0.6 * loc.cloudTaille));
        if(!douteux){
          // le Drive n'a pas bougé depuis la dernière synchronisation : inutile de re-télécharger
          if(vuesAvant[e.id] !== undefined && vuesAvant[e.id] === e.maj){ vues[e.id] = e.maj; continue; }
          if(majDist <= (loc.updatedAt || 0)) continue;
          // la date du Drive tombe pendant notre propre envoi : c'est le fichier que cet appareil vient d'y déposer
          if(enLigneAJour(loc) && loc.cloudDebut && majDist >= loc.cloudDebut - 15000 && majDist <= (loc.cloudOk || 0) + 15000){ vues[e.id] = e.maj; continue; }
        }
      }
      aRecevoir.push(e);
    }
    n = 0;
    for(const e of aRecevoir){
      n++;
      const loc = locaux[e.id];
      etape("Réception " + n + " / " + aRecevoir.length + " — " + nomAudit(e));
      let audit = null, refus = null;
      try{ audit = normaliserAudit(await cloudCharger(e.id)); }
      catch(err){
        if(err.reseau) throw err;
        refus = err;
      }
      if(!audit){
        // Le Drive ne restitue pas cet audit : fichier absent (la liste le cite encore) ou illisible (fichier abîmé).
        const absent = !!refus && /introuvable/i.test(refus.message);
        const detail = refus ? " (" + refus.message + ")" : "";
        if(loc){
          // l'audit est sur cet appareil : on remplace la sauvegarde du Drive par la nôtre, puis on vérifie qu'elle est relisible
          if(reparationsSansEffet[loc.id] === (loc.updatedAt || 0)){
            echecs.push("Drive — " + nomAudit(loc) + " : la sauvegarde reste illisible malgré un renvoi" + detail + ". Vous pouvez réessayer avec ☁️ sur la carte de cet audit.");
            continue;
          }
          etape("Réparation de la sauvegarde — " + nomAudit(loc));
          try{ await reparerSurDrive(loc.id); repares++; }
          catch(err){
            if(err.reseau) throw err;
            echecs.push("Drive — " + nomAudit(loc) + " : la sauvegarde était " + (absent ? "absente" : "illisible") + " et n'a pas pu être remplacée (" + err.message + ")");
          }
        } else if(absent){
          disparus[e.id] = repereDrive(e); nouveauxDisparus++;      // on s'en souvient : elle ne sera plus redemandée
        } else {
          echecs.push("Réception — " + nomAudit(e) + " : la sauvegarde du Drive est illisible" + detail + ". Pour la réparer : sur l'appareil qui contient cet audit, touchez ☁️ sur sa carte.");
        }
        continue;
      }
      if(loc){
        const vLoc = loc.updatedAt || 0, vDrive = audit.updatedAt || 0;
        const photosLoc = loc._resume ? (loc.nbPhotos || 0) : nbPhotos(loc);
        if(vDrive < vLoc){
          // le Drive a une version plus ancienne que celle de cet appareil : on garde la nôtre et on la renvoie
          if(await envoyer(loc)) pousses++;
          continue;
        }
        if(vDrive === vLoc && nbPhotos(audit) <= photosLoc){ vues[e.id] = e.maj; verifies[e.id] = repereDrive(e); continue; }   // même version, relue avec succès : rien à changer ici
      }
      audit.cloudVersion = audit.updatedAt; audit.cloudOk = Date.now(); audit.cloudDernier = audit.cloudOk;
      audit.cloudComplet = estComplet(audit);
      delete audit.cloudDebut; delete audit.cloudTaille;
      if(await dbPut(audit)){ oublierSuppression(e.id); vues[e.id] = e.maj; verifies[e.id] = repereDrive(e); importes++; }
    }
    termine = true;
  }finally{
    // interrompue en route : on garde ce qui a déjà été vérifié, sans rien oublier de l'ancienne mémoire
    noterMajVues(termine ? vues : Object.assign({}, vuesAvant, vues));
    noterVerifiesDrive(termine ? verifies : Object.assign({}, verifiesAvant, verifies));
    noterDisparusDrive(termine ? disparus : Object.assign({}, disparusAvant, disparus));
    cache = await dbAllLege();
  }
  return { pousses, importes, illisibles, repares, disparus: nouveauxDisparus, echecs };
}
/* Remplace sur le Drive une sauvegarde absente ou illisible par l'audit complet de cet appareil,
   puis relit ce que le Drive restitue pour s'assurer que la sauvegarde est de nouveau utilisable. */
const reparationsSansEffet = {};   // id → version déjà renvoyée sans que le Drive la restitue : on n'insiste pas pendant cette session
async function reparerSurDrive(id){
  const complet = await chargerComplet(id);
  if(!complet) throw new Error("lecture de l'audit impossible sur cet appareil");
  await envoyerAudit(complet);
  // Relecture de contrôle. Le Drive met parfois un instant à présenter un fichier tout juste écrit : jusqu'à trois essais.
  let relu = false, motif = null;
  for(let essai = 0; essai < 3 && !relu; essai++){
    if(essai) await new Promise((r) => setTimeout(r, 2000));
    try{
      const a = normaliserAudit(await cloudCharger(id));
      if(a && (a.updatedAt || 0) === (complet.updatedAt || 0)) relu = true;
      else motif = new Error("le Drive ne restitue pas la version qui vient d'être envoyée");
    }catch(err){
      if(err.reseau) throw err;
      motif = new Error("le Drive ne restitue toujours pas cet audit après renvoi — " + err.message);
    }
  }
  if(!relu){
    reparationsSansEffet[id] = complet.updatedAt || 0;
    throw motif;
  }
}
// Fenêtre d'explication pour un problème en ligne : elle reste affichée, le temps de lire ou de faire une capture
function afficherProbleme(titre, message, lignes){
  const liste = lignes || [];
  showModal(`<h3>⚠️ ${esc(titre)}</h3>
    <p style="font-size:14px; margin:0 0 10px; word-break:break-word;">${esc(message)}</p>
    ${liste.slice(0, 6).map((l) => `<p class="meta" style="word-break:break-word; margin:6px 0;">• ${esc(l)}</p>`).join("")}
    ${liste.length > 6 ? `<p class="meta">… et ${liste.length - 6} autre(s)</p>` : ""}
    <p class="meta" style="margin-top:10px;">Rien n'est perdu : vos audits restent enregistrés sur l'appareil. Si le problème revient, faites une capture de cet écran.</p>
    <button class="btn primary block" data-action="close-modal">Fermer</button>`);
}
async function cloudRestaurer(){
  try{
    actionCloudManuelle();
    toast("Recherche des sauvegardes…");
    const absents = disparusDrive();
    // sans les doublons, ni les sauvegardes dont on sait que le fichier n'existe plus sur le Drive
    const liste = dedoublonner(await cloudLister()).filter((a) => !estDisparu(absents, a));
    if(!liste.length){
      showModal(`<h3>☁️ Restaurer</h3><div class="empty">Aucune sauvegarde dans votre Drive pour l'instant.</div>
        <button class="btn primary block" data-action="close-modal">Fermer</button>`);
      return;
    }
    showModal(`<h3>☁️ Sauvegardes dans votre Drive</h3>
      ${liste.map((a) => `
        <div class="pl-item"><span style="flex:1; min-width:0;"><b style="font-size:13.5px;">${esc(a.restaurant || "?")}</b>
        <span class="meta" style="display:block;">${esc(a.date || "?")}${a.type === "proprete" ? " · 🧽 propreté" : ""} · ${Math.round((a.taille || 0) / 1024)} Ko</span></span>
        <button class="btn ghost" data-action="cloud-import" data-id="${esc(a.id)}" data-maj="${esc(repereDrive(a))}" style="min-height:38px; padding:8px 12px;">Importer</button></div>`).join("")}
      <button class="btn primary block" data-action="close-modal" style="margin-top:10px;">Fermer</button>`);
  }catch(e){ afficherProbleme("Liste du Drive indisponible", e.message, []); }
}

    const rec = new SR();
    rec.lang = "fr-FR"; rec.interimResults = false; rec.continuous = true;
    el.classList.add("ecoute");
    window._dictee = { qid, rec, btn: el };
    rec.onresult = (ev) => {
      let texte = "";
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        if(ev.results[i].isFinal) texte += ev.results[i][0].transcript;
      }
      if(texte){
        note.value = note.value ? note.value + " " + texte.trim() : texte.trim();
        if(current){ current.notes[qid] = note.value; scheduleSave(); }
      }
    };
    rec.onerror = () => { el.classList.remove("ecoute"); toast("Dictée interrompue — réessayez"); };
    rec.onend = () => { el.classList.remove("ecoute"); if(window._dictee && window._dictee.qid === qid) window._dictee = null; };
    try{ rec.start(); }catch(e){ el.classList.remove("ecoute"); toast("Dictée indisponible"); }
  }
  else if(act === "fq"){
    const secF = current && grilleDe(current)[state.sec];
    if(!secF) return;
    state.fq = Math.max(0, Math.min(secF.questions.length - 1, state.fq + parseInt(el.dataset.d, 10)));
    renderAudit();
  }
  else if(act === "reessayer"){
    recupererStockage().catch(() => renderList());
  }
  else if(act === "vetocrit"){
    const r = reglages();
    r.vetocrit = el.dataset.v;
    saveReglages(r);
    el.parentNode.querySelectorAll(".vetochip").forEach((b) => b.classList.toggle("sel", b.dataset.v === r.vetocrit));
    toast("Règle critique : " + el.textContent);
  }
  else if(act === "suivi-tab"){ state.suiviTab = el.dataset.t; renderSuivi(); }
  else if(act === "suivi-type"){ state.suiviType = el.dataset.v; renderSuivi(); }
  else if(act === "prop-sec"){
    const s = SECTIONS[parseInt(el.dataset.i, 10)];
    if(!s) return;
    const garde = new Set(questionsProprete());
    s.questions.forEach((q) => { if(el.dataset.v === "1") garde.add(q.id); else garde.delete(q.id); });
    enregistrerProprete(garde);
    renderProprete(true);
  }
  else if(act === "prop-defaut"){
    const r = reglages();
    delete r.proprete;
    saveReglages(r);
    renderProprete(true);
    toast("Sélection d'origine rétablie ✓");
  }
  else if(act === "verifier-relais"){
    el.disabled = true; el.textContent = "Vérification en cours…";
    verifierRelais()
      .then((v) => {
        if(document.body.contains(el)) modalReglages();
        toast(v === "ancien" ? "⚠️ C'est encore l'ancienne version du relais qui répond" : "✓ Relais en service : version " + v, 6000);
      })
      .catch((err) => {
        if(document.body.contains(el)) modalReglages();
        toast("Vérification impossible : " + err.message, 6000);
      });
  }
  else if(act === "suivi-resto"){ state.suiviResto = el.dataset.r; state.suiviTab = "evolution"; renderSuivi(); }
  else if(act === "grp-mois"){ state.grpMois = el.dataset.k; renderSuivi(); }
  else if(act === "grille-sec"){ state.grilleSec = parseInt(el.dataset.i, 10); renderGrille(); }
  else if(act === "grille-add"){
    const txt = document.getElementById("cqText").value.trim();
    if(!txt){ toast("Écrivez la question d'abord"); return; }
    const r = reglages();
    r.grille = r.grille || [];
    r.grille.push({ sec:state.grilleSec, t:txt, id:"cx" + Date.now().toString(36) });
    saveReglages(r);
    appliquerGrillePerso();
    renderGrille();
    toast("Question ajoutée ✓");
  }
  else if(act === "grille-del"){
    const r = reglages();
    r.grille = (r.grille || []).filter((p) => p.id !== el.dataset.id);
    saveReglages(r);
    appliquerGrillePerso();
    renderGrille();
  }
});

// Sélecteur de photos
function appliquerMesure(qid){
  const q = SECTIONS.flatMap((x) => x.questions).find((x) => x.id === qid);
  const m = q && q.mesure;
  if(!m || !current) return;
  const v = parseFloat(String(current.mesures[qid] || "").replace(",", "."));
  if(isNaN(v)) return;
  const conforme = m.sens === "min" ? v >= m.seuil : v <= m.seuil;
  current.answers[qid] = conforme ? "oui" : "non";
  let note = (current.notes[qid] || "").replace(/\s*—?\s*Mesuré\s*:\s*[^—]*$/i, "").trim();
  note = (note ? note + " — " : "") + "Mesuré : " + v.toLocaleString("fr-FR") + " " + m.unite + (conforme ? "" : " (limite " + m.seuil + " " + m.unite + ")");
  current.notes[qid] = note;
  scheduleSave(); renderAudit(true);   // sur place : l'écran reste sur la question dont on vient de saisir le relevé
}

// Import de sauvegarde
document.getElementById("importInput").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  if(!db){ toast("Import impossible : le stockage de l'appareil est indisponible"); return; }
  try{
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : ((data && Array.isArray(data.exports)) ? data.exports : []);
    const locaux = {};
    cache.forEach((a) => locaux[a.id] = a);
    const aImporter = [], risques = [];
    let illisibles = 0, identiques = 0;
    for(const brut of list){
      const rec = normaliserAudit(brut);          // copie contrôlée : rien de ce fichier n'est repris tel quel
      if(!rec){ illisibles++; continue; }
      const loc = locaux[rec.id];
      const photosLocales = loc ? (loc._resume ? (loc.nbPhotos || 0) : nbPhotos(loc)) : 0;
      if(loc && (rec.updatedAt || 0) === (loc.updatedAt || 0) && nbPhotos(rec) === photosLocales){ identiques++; continue; }
      if(remplacementRisque(loc, rec)) risques.push(rec); else aImporter.push(rec);
    }
    // Un audit du fichier plus ancien, ou avec moins de photos, que celui de l'appareil ne le remplace pas sans accord
    let gardes = 0;
    if(risques.length){
      if(confirm(risques.length + " audit(s) du fichier sont plus anciens, ou contiennent moins de photos, que ceux de cet appareil.\n\nOK : les remplacer quand même par ceux du fichier\nAnnuler : garder ceux de l'appareil")) risques.forEach((r) => aImporter.push(r));
      else gardes = risques.length;
    }
    let n = 0, echecs = 0;
    for(const rec of aImporter){
      if(await dbPut(rec)){ oublierSuppression(rec.id); n++; } else echecs++;
    }
    cache = await dbAllLege();
    renderList();
    const details = [];
    if(identiques) details.push(identiques + " déjà à jour");
    if(gardes) details.push(gardes + " gardé(s) tel(s) quel(s)");
    if(illisibles) details.push(illisibles + " illisible(s)");
    if(echecs) details.push(echecs + " non enregistré(s)");
    toast(n + " audit(s) importé(s) ✓" + (details.length ? " · " + details.join(", ") : ""));
  }catch(err){ console.error(err); toast("Fichier de sauvegarde invalide"); }
});

// Fermeture des surcouches
overlay.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if(!el){ return; }
  const act = el.dataset.action;
  if(act === "modal-bg"){
    if(e.target === el) closeModal();   // clic direct sur le fond, pas à l'intérieur de la fenêtre
    return;
  }
  if(act === "close-viewer" || act === "del-photo-viewer"){
    if(act === "del-photo-viewer" && state.viewer && current){
      const { qid, i } = state.viewer;
      current.photos[qid].splice(i, 1);
      if(!current.photos[qid].length) delete current.photos[qid];
      scheduleSave(); renderPhotoRow(qid);
    }
    state.viewer = null;
    overlay.innerHTML = ""; overlay.style.display = "none";
  }
});

/* ---------- Démarrage ---------- */
window.addEventListener("unhandledrejection", function(ev){
  try{
    const el = document.getElementById("app");
    if(el && (el.innerHTML.length < 50 || el.querySelector("[data-demarrage]"))){
      el.innerHTML = '<div class="wrap" style="padding-top:30px;"><div class="card" style="border:2px solid var(--bad);"><h3>⚠️ Erreur</h3><p class="meta" style="word-break:break-all;">'
        + String(ev.reason && ev.reason.message || ev.reason).replace(/</g, "&lt;").slice(0, 250)
        + '</p><p class="meta">📸 Envoyez une capture d écran pour correction — ou fermez tous les onglets du site puis rouvrez.</p></div></div>';
    }
  }catch(e){}
});
window.onerror = function(msg, source, ligne){
  try{
    const el = document.getElementById("app");
    if(el && (el.innerHTML.length < 50 || el.querySelector("[data-demarrage]"))){
      el.innerHTML = '<div class="wrap" style="padding-top:30px;"><div class="card" style="border:2px solid var(--bad);">'
        + '<h3>⚠️ Erreur de démarrage</h3><p class="meta" style="word-break:break-all;">'
        + String(msg).replace(/</g, "&lt;") + ' (ligne ' + ligne + ')</p>'
        + '<p class="meta">📸 Envoyez une capture d\'écran pour correction — ou fermez tous les onglets du site puis rouvrez-le.</p></div></div>';
    }
  }catch(e){}
};
// Affiché seulement à la première ouverture après la mise à jour, le temps de préparer la liste rapide
function afficherPreparation(fait, total){
  const el = document.getElementById("app");
  if(el) el.innerHTML = '<div class="wrap" data-demarrage="1"><div class="empty">⏳ Mise à jour du stockage… ' + fait + ' / ' + total
    + '<br><small>Une seule fois, après la mise à jour de l\'application. Vos audits et vos photos ne sont pas modifiés.</small></div></div>';
}
(async function init(){
  try{
    let ok = false;
    if(window.indexedDB){ ok = await avecDelai(openDB(), 3500).then((r) => r.etat === "ok" && r.valeur === true); }
    if(!ok) stockageHS = true;
    cache = await chargerListe(afficherPreparation);
    appliquerGrillePerso();
    if(!reglages().cle){ const r = reglages(); r.cle = CLE_CLOUD_DEFAUT; saveReglages(r); }
    renderList();
    demarre = true;
    setTimeout(() => { rattrapageEnLigne().catch(console.error); }, 15000);
  }catch(e){
    const el = document.getElementById("app");
    if(el) el.innerHTML = '<div class="wrap" style="padding-top:30px;"><div class="card" style="border:2px solid var(--bad);"><h3>⚠️ Erreur de démarrage</h3><p class="meta" style="word-break:break-all;">'
      + String(e && e.stack || e).replace(/</g, "&lt;").slice(0, 300) + '</p><p class="meta">Fermez tous les onglets du site puis rouvrez — vos audits sont conservés.</p></div></div>';
  }
})();

// Avant que l'app passe en arrière-plan ou se ferme : on enregistre tout de suite ce qui attend
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") sauverMaintenant(); });
window.addEventListener("pagehide", () => { sauverMaintenant(); });
// Le réseau revient : on renvoie les audits terminés qui n'étaient pas à jour en ligne
window.addEventListener("online", () => { if(demarre) rattrapageEnLigne().catch(console.error); });

// Glissement gauche/droite en mode focus
let tX = null;
app.addEventListener("touchstart", (e) => { tX = e.touches[0].clientX; }, { passive:true });
app.addEventListener("touchend", (e) => {
  if(tX === null) return;
  const dx = e.changedTouches[0].clientX - tX;
  tX = null;
  if(state.view !== "audit" || !reglages().focus) return;
  if(Math.abs(dx) < 60) return;
  const secT = current && grilleDe(current)[state.sec];
  if(!secT) return;
  const qs = secT.questions;
  state.fq = Math.max(0, Math.min(qs.length - 1, state.fq + (dx < 0 ? 1 : -1)));
  renderAudit();
}, { passive:true });
</script>
