<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#0f766e"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<meta name="format-detection" content="telephone=no"/>
<title>Audit Cuisine</title>
<style>
  :root{
    --brand:#0f766e; --brand-dark:#115e59; --brand-soft:#ccfbf1;
    --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45;
  }
  button{font-family:inherit; touch-action:manipulation; cursor:pointer;}
  .wrap{max-width:640px; margin:0 auto; padding:0 14px calc(90px + env(safe-area-inset-bottom));}
  .hide{display:none !important;}

  /* ---------- Barre du haut ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .tb-in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:10px;}
  .tb-back{border:none; background:var(--brand-soft); color:var(--brand-dark); width:38px; height:38px;
    border-radius:12px; font-size:19px; flex:none;}
  .tb-title{flex:1; min-width:0;}
  .tb-title b{display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-title small{color:var(--muted); font-size:12.5px;}
  .scorechip{color:#fff; font-weight:700; font-size:14px; padding:5px 11px; border-radius:999px; background:#94a3b8; flex:none;}
  .progress{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px; max-width:640px; margin-left:auto; margin-right:auto;}
  .progress i{display:block; height:100%; width:0%; background:var(--brand); border-radius:99px; transition:width .25s;}
  .savestate{font-size:11px; color:var(--muted); text-align:right; margin-top:4px; max-width:640px; margin-left:auto; margin-right:auto;}

  /* ---------- Chips de sections ---------- */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 14px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; position:sticky; top:var(--haut-barre, calc(64px + env(safe-area-inset-top))); z-index:25;
    background:linear-gradient(var(--bg) 82%, transparent);}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; display:flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:#fff;
    border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; color:#334155;}
  .chip .cnt{font-weight:700; color:var(--muted); font-size:11.5px; background:var(--bg); border-radius:99px; padding:2px 7px;}
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .chip.active .cnt{background:rgba(255,255,255,.25); color:#fff;}
  .chip.done{border-color:var(--ok);}
  .chip.done .cnt{background:#dcfce7; color:#166534;}

  /* ---------- Cartes de questions ---------- */
  .sec-head{display:flex; align-items:center; gap:10px; margin:16px 2px 4px;}
  .sec-head h2{font-size:18px; margin:0; flex:1; line-height:1.3;}
  .sec-head .scorechip{font-size:13px;}
  .sec-bar{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 2px 2px;}
  .sec-bar i{display:block; height:100%; width:0%; background:var(--brand); transition:width .25s;}
  .sec-warn{color:var(--warn); font-size:13px; font-weight:600; margin:8px 2px 0;}
  .group-label{margin:18px 2px 8px; padding:8px 12px; background:#e0f2fe; color:#075985;
    border-radius:10px; font-size:13.5px; font-weight:700;}
  .qcard{background:var(--card); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .qtop{display:flex; gap:10px; margin-bottom:11px;}
  .qnum{flex:none; width:26px; height:26px; border-radius:9px; background:var(--brand-soft); color:var(--brand-dark);
    font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .qtext{font-size:15px; font-weight:600; line-height:1.4;}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .seg .b{border:1.5px solid var(--line); background:#f8fafc; border-radius:12px; padding:10px 4px;
    font-size:14.5px; font-weight:700; color:#475569; display:flex; align-items:center; justify-content:center; gap:7px; min-height:46px;}
  .seg .b span{font-size:14.5px;}
  .b-oui.sel{background:#dcfce7; border-color:var(--ok); color:#166534;}
  .b-non.sel{background:#fee2e2; border-color:var(--bad); color:#991b1b;}
  .b-na.sel{background:#e2e8f0; border-color:#94a3b8; color:#334155;}
  /* Question inversée : « Non » est la réponse conforme (vert), « Oui » est un défaut (rouge) */
  .qcard.inv .b-non.sel{background:#dcfce7; border-color:var(--ok); color:#166534;}
  .qcard.inv .b-oui.sel{background:#fee2e2; border-color:var(--bad); color:#991b1b;}
  .note{width:100%; min-height:64px; margin-top:10px; border:1.5px solid var(--line); border-radius:12px;
    padding:9px 11px; font-size:16px; font-family:inherit; resize:vertical; background:#fffbeb;}
  .phrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center;}
  .phwrap{position:relative; display:inline-block;}
  .ph{width:62px; height:62px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block;}
  .phdel{position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:99px; border:none;
    background:#0f172a; color:#fff; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .addph{border:1.5px dashed #94a3b8; background:#f8fafc; color:#475569; border-radius:10px;
    padding:9px 13px; font-size:13.5px; font-weight:600;}

  /* ---------- Pied de navigation ---------- */
  .footerbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .fb-in{max-width:640px; margin:0 auto; display:flex; gap:10px;}
  .fbtn{flex:1; border:none; border-radius:13px; padding:13px 8px; font-size:14.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:2px; min-height:52px; justify-content:center;}
  .fbtn small{font-size:11px; font-weight:600; opacity:.75; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fbtn.ghost{background:#f1f5f9; color:#334155;}
  .fbtn.primary{background:var(--brand); color:#fff;}

  /* ---------- Accueil ---------- */
  .home-head{padding:26px 2px 8px;}
  .home-head h1{margin:0; font-size:24px;}
  .home-head p{margin:6px 0 0; color:var(--muted); font-size:14px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:13px;
    padding:13px 18px; font-size:15px; font-weight:700; min-height:48px;}
  .btn.primary{background:var(--brand); color:#fff;}
  .btn.ghost{background:#fff; color:#334155; border:1.5px solid var(--line);}
  .btn.danger{background:#fee2e2; color:#991b1b;}
  .btn.block{width:100%;}
  .card{background:var(--card); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .card-head{display:flex; align-items:flex-start; gap:10px; cursor:pointer;}
  .card-title{font-size:16.5px; font-weight:800; margin:0;}
  .meta{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:10px;}
  .bar i{display:block; height:100%; border-radius:99px; background:var(--brand); transition:width .25s;}
  .row-actions{display:flex; gap:7px; margin-top:12px; flex-wrap:wrap;}
  .row-actions .btn{padding:9px 12px; font-size:13px; min-height:40px; border-radius:10px; flex:1;}
  .empty{text-align:center; padding:40px 10px; color:var(--muted);}
  .tip{font-size:12.5px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.5;}
  .tools{display:flex; gap:8px; margin-top:14px;}
  .tools .btn{flex:1; font-size:12.5px; padding:10px 6px; min-height:42px;}

  /* ---------- Rapport ---------- */
  .rep-hero{background:var(--card); border-radius:18px; padding:20px; margin:16px 0 10px; text-align:center;
    box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .gauge{position:relative; width:150px; height:150px; margin:6px auto 4px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .gval{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge .gval b{font-size:34px; line-height:1;}
  .gauge .gval small{color:var(--muted); font-size:12px; margin-top:3px;}
  .interp{display:inline-block; color:#fff; font-weight:800; font-size:15px; padding:7px 16px; border-radius:999px; margin-top:8px;}
  .rep-meta{text-align:center; color:var(--muted); font-size:13px; margin:4px 0 14px;}
  .secrow{background:var(--card); border-radius:13px; padding:11px 13px; margin:8px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .secrow .sr-top{display:flex; align-items:center; gap:8px;}
  .secrow .sr-top b{flex:1; font-size:13.5px; line-height:1.35;}
  .secrow .scorechip{font-size:12px; padding:3px 9px;}
  .secrow .bar{margin-top:8px;}
  .rep-actions{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:16px 0 6px;}
  .nc-sec{margin-top:20px;}
  .nc-sec h3{font-size:15.5px; margin:0 0 8px;}
  .nc-item{background:var(--card); border-left:4px solid var(--bad); border-radius:12px; padding:11px 13px; margin:8px 0;
    box-shadow:0 1px 3px rgba(15,23,42,.07); break-inside:avoid;}
  .nc-item p{margin:0; font-size:14px; font-weight:600;}
  .nc-note{margin:7px 0 0; font-size:13px; color:#7c2d12; background:#fffbeb; border-radius:8px; padding:7px 9px;}
  .nc-photos{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .nc-photos img{width:74px; height:74px; object-fit:cover; border-radius:9px; border:1px solid var(--line);}
  .rep-ok{color:var(--ok); font-weight:700; text-align:center; padding:18px 0 8px; font-size:15px;}
  .legend{color:var(--muted); font-size:12px; text-align:center; margin-top:16px; line-height:1.5;}

  /* ---------- Modale / visionneuse / toast ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60; display:flex;
    align-items:flex-end; justify-content:center; padding:0;}
  @media (min-width:520px){ .modal-bg{align-items:center; padding:20px;} }
  .sheet{background:#fff; width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:20px;
    max-height:88vh; overflow:auto;}
  @media (min-width:520px){ .sheet{border-radius:20px;} }
  .sheet h3{margin:0 0 14px; font-size:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:5px;}
  .field input{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px;
    font-size:16px; font-family:inherit;}
  .sheet .btn{width:100%; margin-top:6px;}
  .viewer{position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:80; display:flex;
    flex-direction:column; align-items:center; justify-content:center; padding:16px;}
  .viewer img{max-width:100%; max-height:78vh; border-radius:10px;}
  .viewer-actions{display:flex; gap:10px; margin-top:14px;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom));
    background:#0f172a; color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    z-index:99; opacity:0; pointer-events:none; transition:opacity .25s; max-width:86vw; text-align:center;}
  .toast.show{opacity:.96;}

  .actrow{display:flex; gap:6px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  .actrow input{border:1.5px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; flex:1; min-width:110px; font-family:inherit;}
  .actstatut{border:none; border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:800; background:#fee2e2; color:#991b1b; min-height:38px;}
  .actstatut.fait{background:#dcfce7; color:#166534;}
  .fpos{flex:none; font-weight:800; font-size:14px; color:#334155; padding:0 6px; display:flex; align-items:center;}
  .setrow{display:flex; align-items:center; gap:10px; margin:12px 0; font-size:14px; flex-wrap:wrap;}
  .setrow input[type="checkbox"]{width:20px; height:20px;}
  .pl-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .pl-item:last-child{border-bottom:none;}
  .pl-statut{font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; flex:none;}
  .rep-logo{max-height:64px; max-width:180px; object-fit:contain; display:block; margin:0 auto 8px;}
  .toutoui{border:1.5px solid var(--ok); background:#f0fdf4; color:#166534; border-radius:10px;
    padding:7px 12px; font-size:12.5px; font-weight:800; flex:none;}
  .cqrow{display:flex; gap:8px; margin:8px 0; align-items:center;}
  .cqrow input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; font-family:inherit;}
  .cqdel{border:none; background:#fee2e2; color:#991b1b; width:32px; height:32px; border-radius:9px; font-size:15px; flex:none;}
  .delta{font-size:11px; font-weight:800; margin-left:6px;}
  .rappel{background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; border-radius:8px;
    padding:6px 9px; font-size:12.5px; margin-bottom:9px; font-weight:600;}
  .crit-banner{background:#dc2626; color:#fff; border-radius:12px; padding:11px 14px;
    font-weight:800; font-size:13.5px; margin:10px 0 2px; text-align:left;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag{border:1.5px solid var(--brand); background:var(--brand-soft); color:var(--brand-dark);
    border-radius:99px; padding:5px 10px; font-size:11.5px; font-weight:700;}
  .chipgrp{display:flex; gap:5px; align-items:center; flex-wrap:wrap; width:100%;}
  .chiplab{font-size:11.5px; font-weight:800; color:var(--muted); width:52px; flex:none;}
  .qchip{border:1.5px solid var(--line); background:#f8fafc; border-radius:99px;
    padding:5px 10px; font-size:11.5px; font-weight:700; color:#475569;}
  .qchip.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  .sigrow{display:flex; gap:10px;}
  .sigbox{flex:1; text-align:center; min-width:0;}
  .sigpad{width:100%; height:90px; border:1.5px dashed var(--line); border-radius:10px;
    background:#fff; touch-action:none; display:block;}
  .sigbox small{display:block; margin:4px 0; color:var(--muted); font-weight:700;}
  .noterow{display:flex; gap:6px; align-items:stretch;}
  .noterow .note{flex:1;}
  .mic{flex:none; width:46px; border:1.5px solid var(--line); background:#fff; border-radius:10px; font-size:18px;}
  .mic.ecoute{background:#dc2626; border-color:#dc2626; color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.6;}}
  .mesure{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .mesure input{width:110px; border:1.5px solid #0369a1; background:#f0f9ff; color:#075985; border-radius:10px;
    padding:8px 10px; font-size:15px; font-weight:700; font-family:inherit;}
  .mesure span{font-size:12px; font-weight:800; color:#0369a1;}
  .sig-alerte{background:#fff7ed; color:#9a3412; border:1.5px solid #f97316; border-radius:10px;
    padding:9px 12px; font-size:13px; font-weight:700; margin:10px 0; text-align:left;}
  .sigdate{display:block; min-height:15px; margin:0 0 4px; font-size:11px; color:var(--muted);}
  .recidive{background:#7c2d12; color:#fff; border-radius:6px; padding:2px 8px; font-size:11px;
    font-weight:800; margin-left:6px; white-space:nowrap;}
  .up{color:var(--ok);}
  .down{color:var(--bad);}
  .navrow{display:flex; gap:6px; overflow-x:auto; padding:8px 2px 4px; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navchip,.vetochip{border:1.5px solid var(--line); background:#fff; border-radius:99px;
    padding:6px 12px; font-size:12.5px; font-weight:700; color:#475569; flex:none;}
  .badge-prop{display:inline-block; font-size:11.5px; font-weight:800; color:var(--brand-dark); background:var(--brand-soft);
    border-radius:99px; padding:1px 8px; vertical-align:middle;}
  .typechoix{display:flex; gap:8px;}
  .typebtn{flex:1; border:2px solid var(--line); background:#fff; border-radius:12px; padding:10px 8px; text-align:center;
    cursor:pointer; font:inherit; color:inherit;}
  .typebtn b{display:block; font-size:15px;}
  .typebtn small{display:block; color:var(--muted); font-size:12px; margin-top:2px;}
  .typebtn.sel{border-color:var(--brand); background:#f0fdfa; box-shadow:inset 0 0 0 1px var(--brand);}
  .typebtn:disabled{opacity:.5; cursor:default;}
  .propq{display:flex; gap:10px; align-items:flex-start; padding:9px 2px; border-top:1px solid var(--line); font-size:14px; cursor:pointer;}
  .propq input{width:20px; height:20px; flex:none; margin:1px 0 0; accent-color:var(--brand);}
  .navchip.active,.vetochip.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  .critphoto{display:block; width:100%; background:#fff7ed; color:#9a3412; border:2px solid #f97316;
    border-radius:10px; padding:9px 10px; font-size:12.5px; font-weight:800; margin-top:8px;
    animation:clignote 1.3s infinite;}
  @keyframes clignote{50%{background:#fed7aa;}}
  .outils{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center;}
  .outil{border:1.5px solid var(--line); background:#fff; color:#334155; border-radius:10px;
    padding:8px 12px; font-size:13px; font-weight:700;}
  .outil.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  #annCv{max-width:96vw; max-height:62vh; border-radius:10px; touch-action:none; cursor:crosshair;}
  @media print{
    .noprint{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none; padding:0;}
    .rep-hero,.secrow,.nc-item{box-shadow:none; border:1px solid #e2e8f0;}
  }
</style>
</head>

  new Function("(async()=>{})()");

}
</script>
<noscript>

<script>
"use strict";

/* Configuration du relais (sauvegarde en ligne des audits) */
const RELAIS_CLOUD = "https://script.google.com/macros/s/AKfycbxhvcIrQZddA2dyXpVeYl2-Jqikto2qJyq9-JQeOYj377OuNlOLRcev3DSvI8IuQpBZ4Q/exec";
const CLE_CLOUD_DEFAUT = "f65bca368ee2";

/* =====================================================================
   DONNÉES : les 13 sections de l'audit (issues du fichier Excel d'origine)

/* ---- Deux types d'audit : « classique » (toute la grille) ou « propreté » (les questions de propreté seulement).
   Un audit propreté garde la liste de ses questions (perimetre) : changer la sélection dans les réglages
   ne concerne que les audits propreté créés ensuite, jamais les scores des audits déjà faits. ---- */
const PROPRETE_DEFAUT = [
  "s2q6", "s2q13", "s2q15", "s2q18",                 // planning de nettoyage, lavettes, produits d'entretien, déchets
  "s4q4", "s5q4", "s6q4", "s7q4", "s8q4", "s9q4",    // chambres froides, frigos des postes, étagères de l'épicerie
  "s10q1", "s10q6", "s10q9", "s10q10",               // tenues, tabliers et torchons, vestiaires, toilettes
  "s11q2", "s11q4", "s11q5",                         // poubelles, petit matériel, matériel de plonge
  ...Array.from({ length:18 }, (_, j) => "s11q" + (j + 6)),   // toute la section « Matériels »
  "s12q12", "s12q16"                                 // propreté des postes pendant et après le service
];
function estProprete(a){ return !!a && a.type === "proprete"; }
// Questions retenues pour les prochains audits propreté (réglages), sinon la sélection par défaut
function questionsProprete(){
  const l = reglages().proprete;
  return Array.isArray(l) ? l.filter((x) => typeof x === "string") : PROPRETE_DEFAUT.slice();
}
// Sections et questions d'un audit : toute la grille, ou pour un audit propreté ses seules questions
// (les sections sans aucune question retenue disparaissent ; « idx » garde le rang d'origine de la section)
const grillesMemo = new Map();
function grilleDe(audit){
  if(!estProprete(audit)) return SECTIONS;
  const ids = Array.isArray(audit.perimetre) ? audit.perimetre : questionsProprete();
  const cle = ids.join(",");
  let g = grillesMemo.get(cle);
  if(!g){
    const garde = new Set(ids);
    g = [];
    SECTIONS.forEach((s) => {
      const qs = s.questions.filter((q) => garde.has(q.id));
      if(qs.length) g.push(Object.assign({}, s, { questions:qs }));
    });
    grillesMemo.set(cle, g);
  }
  return g.length ? g : SECTIONS;   // aucune question reconnue : on montre toute la grille plutôt qu'un audit vide
}
function totalDe(audit){ return grilleDe(audit).reduce((n, s) => n + s.questions.length, 0); }
// Identifiants retenus (« garde »), dans l'ordre de la grille et sans ceux des questions qui n'existent plus
function idsDansLaGrille(garde){
  const ids = [];
  SECTIONS.forEach((s) => s.questions.forEach((q) => { if(garde.has(q.id)) ids.push(q.id); }));
  return ids;
}
function idsProprete(){ return idsDansLaGrille(new Set(questionsProprete())); }
function libelleType(a){ return estProprete(a) ? "Audit propreté" : "Audit classique"; }

/* ---- Réglages locaux ---- */

/* ---- Questions personnalisées (ajoutées en fin de section) ---- */
function appliquerGrillePerso(){
  const r0 = reglages();
  if(!r0.grilleV2){
    // ancienne indexation (12 sections) : le service était l'index 11, il est passé à 12.
    // Le repère est posé même sans question perso, sinon la première question ajoutée
    // dans « Matériels » (index 11) serait prise pour une ancienne et déplacée dans « Service ».
    (r0.grille || []).forEach((p) => { if(p.sec === 11) p.sec = 12; });
    r0.grilleV2 = true;
    saveReglages(r0);
  }
  const persos = reglages().grille || [];
  SECTIONS.forEach((s) => { s.questions = s.questions.filter((q) => !q.perso); });
  persos.forEach((p) => {
    const s = SECTIONS[p.sec];
    if(!s) return;
    s.questions.push({ t:p.t, id:p.id, perso:true });
  });
  grillesMemo.clear();   // les grilles des audits propreté sont recalculées avec les questions perso à jour
  recalcTotal();
}

/* ---- Résumé d'un audit pour la liste : tout sauf les photos et les signatures.
   Un résumé ne doit jamais être ouvert, modifié ou enregistré à la place de l'audit complet. ---- */
function nbPhotos(rec){
  let n = 0;
  const p = (rec && rec.photos) || {};
  for(const k in p){ if(Array.isArray(p[k])) n += p[k].length; }
  return n;
}
function allege(rec){
  const c = Object.assign({}, rec);
  c.nbPhotos = rec._resume ? (rec.nbPhotos || 0) : nbPhotos(rec);
  c.photos = {};
  c.signatures = {};
  c._resume = true;
  return c;
}

/* ---- Garde-fous : un audit venu d'un fichier, du Drive ou d'une ancienne version doit avoir la bonne forme ---- */
function estObjet(v){ return !!v && typeof v === "object" && !Array.isArray(v); }
function enTexte(v, max){
  if(v == null) return "";
  if(typeof v !== "string") v = (typeof v === "number" || typeof v === "boolean") ? String(v) : "";
  return v.length > max ? v.slice(0, max) : v;
}
function estImage(v){ return typeof v === "string" && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]*$/.test(v); }
// Remet en forme, sur place, les champs dont l'affichage a besoin (sans rien retirer de valable)
function assainir(a){
  a.restaurant = enTexte(a.restaurant, 200);
  a.auditor = enTexte(a.auditor, 200);
  a.date = enTexte(a.date, 40);
  ["answers", "notes", "photos", "actions"].forEach((k) => { if(!estObjet(a[k])) a[k] = {}; });
  ["mesures", "rappels", "signatures", "sigInfos"].forEach((k) => { if(a[k] != null && !estObjet(a[k])) delete a[k]; });
  for(const k in a.answers){ const v = a.answers[k]; if(v !== "oui" && v !== "non" && v !== "na") delete a.answers[k]; }
  for(const k in a.notes){ if(typeof a.notes[k] !== "string") a.notes[k] = enTexte(a.notes[k], 5000); }
  for(const k in a.photos){
    if(!Array.isArray(a.photos[k])) delete a.photos[k];
    else if(a.photos[k].some((p) => typeof p !== "string")) a.photos[k] = a.photos[k].filter((p) => typeof p === "string");
  }
  for(const k in a.actions){ if(!estObjet(a.actions[k])) delete a.actions[k]; }
  if(a.mesures){ for(const k in a.mesures){ if(typeof a.mesures[k] !== "string") a.mesures[k] = enTexte(a.mesures[k], 30); } }
  if(a.rappels){ for(const k in a.rappels){ if(!estObjet(a.rappels[k])) delete a.rappels[k]; } }
  if(a.signatures){ for(const k in a.signatures){ if(typeof a.signatures[k] !== "string") delete a.signatures[k]; } }
  if(a.type !== undefined && a.type !== "proprete") delete a.type;
  if(a.perimetre !== undefined && !(Array.isArray(a.perimetre) && a.perimetre.every((x) => typeof x === "string"))) delete a.perimetre;
  return a;
}
// Copie contrôlée d'un audit reçu de l'extérieur (fichier importé, Drive) ; null s'il est inutilisable
const CLE_SURE = /^[A-Za-z0-9_-]{1,40}$/;
function normaliserAudit(brut){
  if(!estObjet(brut)) return null;
  const id = typeof brut.id === "number" ? String(brut.id) : brut.id;
  if(typeof id !== "string" || !/^[A-Za-z0-9_.:-]{1,80}$/.test(id)) return null;
  const nombre = (v) => (typeof v === "number" && isFinite(v) && v > 0) ? v : undefined;
  const champs = (src, garde) => {
    const out = {};
    if(estObjet(src)){
      for(const k of Object.keys(src)){
        if(!CLE_SURE.test(k) || k === "__proto__") continue;
        const v = garde(src[k]);
        if(v !== undefined) out[k] = v;
      }
    }
    return out;
  };
  const textes = (v) => {            // objet dont on ne garde que les valeurs simples (texte, nombre, oui/non)
    const out = champs(v, (x) => (typeof x === "string" || typeof x === "number" || typeof x === "boolean") ? enTexte(x, 5000) : undefined);
    return out;
  };
  const a = { id };
  a.restaurant = enTexte(brut.restaurant, 200).trim();
  a.auditor = enTexte(brut.auditor, 200).trim();
  a.date = enTexte(brut.date, 40);
  a.createdAt = nombre(brut.createdAt) || Date.now();
  a.updatedAt = nombre(brut.updatedAt) || a.createdAt;
  ["startedAt", "completedAt", "cloudOk", "cloudDernier", "cloudVersion", "cloudDebut", "cloudTaille"].forEach((k) => { const n = nombre(brut[k]); if(n) a[k] = n; });
  if(brut.cloudComplet === true) a.cloudComplet = true;
  if(typeof brut.suiviDe === "string" && brut.suiviDe.length <= 80) a.suiviDe = brut.suiviDe;
  if(brut.type === "proprete"){
    a.type = "proprete";
    if(Array.isArray(brut.perimetre)) a.perimetre = brut.perimetre.filter((x) => typeof x === "string" && CLE_SURE.test(x)).slice(0, 1000);
  }
  a.answers = champs(brut.answers, (v) => (v === "oui" || v === "non" || v === "na") ? v : undefined);
  a.notes = champs(brut.notes, (v) => { const t = enTexte(v, 5000); return t ? t : undefined; });
  a.photos = champs(brut.photos, (v) => { const l = Array.isArray(v) ? v.filter(estImage) : []; return l.length ? l : undefined; });
  a.actions = champs(brut.actions, (v) => estObjet(v) ? textes(v) : undefined);
  const mesures = champs(brut.mesures, (v) => { const t = enTexte(v, 30); return t ? t : undefined; });
  if(Object.keys(mesures).length) a.mesures = mesures;
  const rappels = champs(brut.rappels, (v) => estObjet(v) ? { date:enTexte(v.date, 40), note:enTexte(v.note, 5000) } : undefined);
  if(Object.keys(rappels).length) a.rappels = rappels;
  if(estObjet(brut.signatures)){
    const s = {};
    ["auditeur", "responsable"].forEach((r) => { if(estImage(brut.signatures[r])) s[r] = brut.signatures[r]; });
    if(Object.keys(s).length) a.signatures = s;
  }
  if(estObjet(brut.sigInfos) && a.signatures){   // date et empreinte de chaque signature conservée
    const s = {};
    ["auditeur", "responsable"].forEach((r) => {
      const v = brut.sigInfos[r];
      if(a.signatures[r] && estObjet(v) && typeof v.empreinte === "string" && v.empreinte.length <= 80) s[r] = { le: nombre(v.le) || 0, empreinte: v.empreinte };
    });
    if(Object.keys(s).length) a.sigInfos = s;
  }
  return a;
}
// Vrai si remplacer l'audit de l'appareil par « nouveau » ferait perdre quelque chose
function remplacementRisque(local, nouveau){
  if(!local) return false;
  const photosLocales = local._resume ? (local.nbPhotos || 0) : nbPhotos(local);
  return (nouveau.updatedAt || 0) < (local.updatedAt || 0) || nbPhotos(nouveau) < photosLocales;
}
/* Un audit compte dans le suivi quand il est terminé (toutes les questions de la grille d'origine ont une réponse).
   Une question perso ajoutée plus tard ne fait donc pas disparaître les anciens audits des courbes.
   Un audit propreté est terminé quand toutes ses questions (choisies à sa création) ont une réponse. */
function auditTermine(a){
  if(a.completedAt) return true;
  const prop = estProprete(a);
  for(const s of grilleDe(a)){ for(const q of s.questions){ if((prop || !q.perso) && !a.answers[q.id]) return false; } }
  return true;
}
// Toutes les questions de l'audit ont une réponse
function estComplet(a){ const g = globalStats(a); return g.done >= g.total; }
function parDate(a, b){ return (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0); }

/* ---- Signatures : on retient quand chacune a été faite, et sur quel contenu, pour signaler dans le rapport
   qu'un audit a été modifié après avoir été signé. Rien n'est bloqué : c'est une information. ---- */
const VERSION_EMPREINTE = "e1";
// Empreinte du contenu de l'audit (infos, réponses, constats, relevés, échéances, photos). Les champs vides ne comptent pas.
function empreinteAudit(a){
  const remplis = (o, lire) => Object.keys(o || {}).sort().map((k) => [k, lire ? lire(o[k]) : o[k]]).filter((x) => x[1] !== "" && x[1] != null);
  const contenu = [
    a.restaurant || "", a.auditor || "", a.date || "",
    remplis(a.answers), remplis(a.notes), remplis(a.mesures),
    remplis(a.actions, (v) => (v && (v.echeance || v.quand)) ? (v.echeance || "") + "|" + (v.quand || "") : ""),
    remplis(a.photos, (l) => (Array.isArray(l) && l.length) ? l.map((p) => String(p).length + ":" + String(p).slice(-48)).join(",") : "")
  ];
  // le type ne compte que pour un audit propreté : l'empreinte des audits classiques déjà signés ne change pas
  if(estProprete(a)) contenu.push("proprete", (a.perimetre || []).join(","));
  const texte = JSON.stringify(contenu);
  let h1 = 5381, h2 = 52711;
  for(let i = 0; i < texte.length; i++){ const c = texte.charCodeAt(i); h1 = ((h1 * 33) ^ c) >>> 0; h2 = (Math.imul(h2, 31) + c) >>> 0; }
  return VERSION_EMPREINTE + ":" + texte.length + "-" + h1.toString(36) + "-" + h2.toString(36);
}
function dateHeure(ts){
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
}
// Pour chaque signature : "" (absente), "inconnu" (faite avant cette fonction), "ajour", ou "modifie" (l'audit a changé depuis)
function etatsSignatures(audit){
  const actuelle = empreinteAudit(audit);
  const out = {};
  ["auditeur", "responsable"].forEach((role) => {
    const info = (audit.sigInfos || {})[role];
    if(!(audit.signatures || {})[role]) out[role] = { etat:"" };
    else if(!estObjet(info) || typeof info.empreinte !== "string" || info.empreinte.indexOf(VERSION_EMPREINTE + ":") !== 0) out[role] = { etat:"inconnu" };
    else out[role] = { etat: info.empreinte === actuelle ? "ajour" : "modifie", le: info.le };
  });
  return out;
}
function alerteSignatures(etats){
  const libelles = { auditeur:"de l'auditeur", responsable:"du responsable" };
  const parts = [];
  ["auditeur", "responsable"].forEach((role) => {
    const s = etats[role];
    if(s.etat === "modifie") parts.push("la signature " + libelles[role] + (s.le ? " du " + dateHeure(s.le) : ""));
  });
  return parts.length ? "Audit modifié après " + parts.join(" et ") + " — à faire signer de nouveau." : "";
}
function texteSignature(s){ return (s && (s.etat === "ajour" || s.etat === "modifie") && s.le) ? "Signé le " + dateHeure(s.le) : ""; }
// Met à jour, dans le rapport affiché, la date de chaque signature et l'alerte « modifié après signature »
function majEtatSignatures(audit){
  const etats = etatsSignatures(audit);
  const alerte = alerteSignatures(etats);
  ["sigAlerteHaut", "sigAlerte"].forEach((id) => {
    const el = document.getElementById(id);
    if(el){ el.textContent = alerte ? "⚠️ " + alerte : ""; el.classList.toggle("hide", !alerte); }
  });
  ["auditeur", "responsable"].forEach((role) => {
    const el = document.getElementById("sigDate-" + role);
    if(el) el.textContent = texteSignature(etats[role]);
  });
}

/* ---- Audits supprimés sur cet appareil : la synchronisation ne doit pas les faire revenir ---- */
function supprimes(){ try{ const s = JSON.parse(localStorage.getItem("audit:supprimes") || "{}"); return estObjet(s) ? s : {}; }catch(e){ return {}; } }
function noterSuppression(id){ try{ const s = supprimes(); s[id] = Date.now(); localStorage.setItem("audit:supprimes", JSON.stringify(s)); }catch(e){} }
function oublierSuppression(id){ try{ const s = supprimes(); if(s[id]){ delete s[id]; localStorage.setItem("audit:supprimes", JSON.stringify(s)); } }catch(e){} }
/* ---- Dernière date du Drive vue pour chaque audit jugé à jour : la synchronisation ne re-télécharge pas ce qui n'a pas changé ---- */
function majVues(){ try{ const s = JSON.parse(localStorage.getItem("audit:majDrive") || "{}"); return estObjet(s) ? s : {}; }catch(e){ return {}; } }
function noterMajVues(vues){ try{ localStorage.setItem("audit:majDrive", JSON.stringify(vues)); }catch(e){} }
/* ---- Sauvegardes que la liste du Drive cite encore alors que leur fichier n'existe plus (audits de test supprimés du Drive…) :
   une fois constaté, on ne les redemande plus et on ne les propose plus à la restauration. ---- */
function disparusDrive(){ try{ const s = JSON.parse(localStorage.getItem("audit:disparusDrive") || "{}"); return estObjet(s) ? s : {}; }catch(e){ return {}; } }
function noterDisparusDrive(d){ try{ localStorage.setItem("audit:disparusDrive", JSON.stringify(d)); }catch(e){} }
function repereDrive(e){ return e.maj == null ? "" : String(e.maj); }   // état du fichier sur le Drive, tel que la liste le décrit
/* ---- Fichiers du Drive déjà relus avec succès par cet appareil : un fichier signalé « incomplet » à tort n'est pas re-téléchargé à chaque fois ---- */
function verifiesDrive(){ try{ const s = JSON.parse(localStorage.getItem("audit:verifiesDrive") || "{}"); return estObjet(s) ? s : {}; }catch(e){ return {}; } }
function noterVerifiesDrive(v){ try{ localStorage.setItem("audit:verifiesDrive", JSON.stringify(v)); }catch(e){} }
/* ---- Version du relais en service (le relais 4.4 et les suivants l'indiquent dans leurs réponses) ---- */
function noterVersionRelais(data){
  try{
    if(data && typeof data.relais === "string") localStorage.setItem("audit:relaisVersion", data.relais.slice(0, 20));
    else if(data && (Array.isArray(data.audits) || data.ok === true || data.audit)) localStorage.setItem("audit:relaisVersion", "ancien");
  }catch(e){}
}
function versionRelais(){ try{ return localStorage.getItem("audit:relaisVersion") || ""; }catch(e){ return ""; } }
function estDisparu(disparus, e){ return disparus[e.id] !== undefined && disparus[e.id] === repereDrive(e); }
// La liste du Drive peut citer deux fois le même audit : on ne garde que la ligne la plus récente
function dedoublonner(liste){
  const parId = {};
  (Array.isArray(liste) ? liste : []).forEach((x) => {
    if(!x || typeof x.id !== "string") return;
    const deja = parId[x.id];
    if(!deja || (Date.parse(x.maj) || 0) >= (Date.parse(deja.maj) || 0)) parId[x.id] = x;
  });
  return Object.keys(parId).map((k) => parId[k]);
}

/* =====================================================================
   STOCKAGE (IndexedDB, sauvegarde automatique)
   Deux magasins : « audits » (audit complet, avec photos) et « resumes »
   (copie sans photos, pour la liste). Ils sont toujours écrits ensemble,
   si bien que l'accueil n'a plus besoin de relire les photos.
   ===================================================================== */
let db = null;
let stockageHS = false;   // IndexedDB momentanément indisponible ou bloquée
let resumesPrets = false; // le magasin « resumes » a été vérifié : il contient bien tous les audits
let demarre = false;      // le premier affichage a eu lieu
const DELAI_LISTE = 4000;   // lecture de la liste (légère)
const DELAI_AUDIT = 10000;  // lecture ou écriture d'un audit complet (peut être lourd : photos)
function avecDelai(p, ms){
  return Promise.race([
    Promise.resolve(p).then(
      (v) => ({ etat:"ok", valeur:v === undefined ? null : v }),
      () => ({ etat:"erreur", valeur:null })
    ),
    new Promise((res) => setTimeout(() => res({ etat:"delai", valeur:null }), ms))
  ]);
}
function openDB(){
  return new Promise((resolve) => {
    try{
      const req = indexedDB.open("audit-cuisine-db", 2);
      req.onupgradeneeded = () => {
        // version 2 : ajout du magasin « resumes ». Le magasin « audits » existant n'est pas touché.
        const base = req.result;
        if(!base.objectStoreNames.contains("audits")) base.createObjectStore("audits", { keyPath:"id" });
        if(!base.objectStoreNames.contains("resumes")) base.createObjectStore("resumes", { keyPath:"id" });
      };
      req.onsuccess = () => {
        db = req.result;
        // une version plus récente de l'app (autre onglet) veut mettre la base à jour : on lui laisse la place
        db.onversionchange = () => { try{ db.close(); }catch(e){} db = null; stockageHS = true; };
        resolve(true);
        if(demarre && stockageHS) recupererStockage().catch(console.error);   // la base a fini par s'ouvrir après le délai d'attente
      };
      req.onerror = () => resolve(false);
      req.onblocked = () => resolve(false);   // un autre onglet garde l'ancienne base ouverte ; l'ouverture reprendra quand il sera fermé
    }catch(e){ resolve(false); }
  });
}
// Écrit l'audit complet ET son résumé dans la même transaction (tout ou rien)
function dbPut(rec){
  if(!db || !rec || !rec.id || rec._resume){
    if(rec && rec._resume) console.warn("Enregistrement refusé : copie sans photos de l'audit", rec.id);
    return Promise.resolve(false);
  }
  const p = new Promise((res, rej) => {
    const tx = db.transaction(["audits", "resumes"], "readwrite");
    tx.objectStore("audits").put(rec);
    tx.objectStore("resumes").put(allege(rec));
    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
  return avecDelai(p, DELAI_AUDIT).then((r) => { if(r.etat !== "ok") stockageHS = true; return r.etat === "ok"; });
}
// Relit l'audit complet, lui applique une modification et réécrit les deux magasins, sans passer par la mémoire de l'app
function dbMaj(id, modif){
  if(!db) return Promise.resolve(false);
  const p = new Promise((res, rej) => {
    const tx = db.transaction(["audits", "resumes"], "readwrite");
    const magasin = tx.objectStore("audits");
    const r = magasin.get(id);
    r.onsuccess = () => {
      const rec = r.result;
      if(!rec) return;
      modif(rec);
      magasin.put(rec);
      tx.objectStore("resumes").put(allege(rec));
    };
    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
  return avecDelai(p, DELAI_AUDIT).then((r) => r.etat === "ok");
}
// Lecture de tous les audits complets (lourd : photos). Ne sert plus que de secours si les résumés sont indisponibles.
function dbAll(){
  if(!db) return Promise.resolve(null);
  const p = new Promise((res, rej) => { const tx = db.transaction("audits","readonly"); const r = tx.objectStore("audits").getAll(); tx.oncomplete = () => res(r.result || []); tx.onerror = () => rej(tx.error); });
  return avecDelai(p, 2500).then((r) => {
    if(r.etat !== "ok"){ stockageHS = true; return null; }
    return Array.isArray(r.valeur) ? r.valeur : [];
  });
}
function dbLireResumes(){
  if(!db) return Promise.resolve(null);
  const p = new Promise((res, rej) => { const tx = db.transaction("resumes","readonly"); const r = tx.objectStore("resumes").getAll(); tx.oncomplete = () => res(r.result || []); tx.onerror = () => rej(tx.error); });
  return avecDelai(p, DELAI_LISTE).then((r) => {
    if(r.etat !== "ok"){ stockageHS = true; return null; }
    return Array.isArray(r.valeur) ? r.valeur : [];
  });
}
function dbGet(id){
  if(!db) return Promise.resolve(null);
  const p = new Promise((res, rej) => { const tx = db.transaction("audits","readonly"); const r = tx.objectStore("audits").get(id); tx.oncomplete = () => res(r.result); tx.onerror = () => rej(tx.error); });
  return avecDelai(p, DELAI_AUDIT).then((r) => r.valeur);
}
function dbDel(id){
  if(!db) return Promise.resolve(false);
  const p = new Promise((res, rej) => {
    const tx = db.transaction(["audits", "resumes"], "readwrite");
    tx.objectStore("audits").delete(id);
    tx.objectStore("resumes").delete(id);
    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
  return avecDelai(p, DELAI_AUDIT).then((r) => r.etat === "ok");
}
function dbCles(nom){
  const p = new Promise((res, rej) => { const tx = db.transaction(nom,"readonly"); const r = tx.objectStore(nom).getAllKeys(); tx.oncomplete = () => res(r.result || []); tx.onerror = () => rej(tx.error); });
  return avecDelai(p, 8000).then((r) => { if(r.etat !== "ok") throw new Error("lecture des identifiants impossible"); return r.valeur || []; });
}
// Parcourt les audits complets un par un (pour l'export), sans tout charger d'un coup
function dbParcourir(surChaque){
  return new Promise((res, rej) => {
    if(!db){ rej(new Error("stockage indisponible")); return; }
    let garde = null, fini = false;
    const echec = (e) => { if(fini) return; fini = true; clearTimeout(garde); rej(e || new Error("lecture impossible")); };
    const armer = () => { clearTimeout(garde); garde = setTimeout(() => echec(new Error("lecture trop longue")), 20000); };
    const tx = db.transaction("audits", "readonly");
    const req = tx.objectStore("audits").openCursor();
    armer();
    req.onsuccess = () => {
      const curseur = req.result;
      if(!curseur || fini) return;
      armer();
      try{ surChaque(curseur.value); curseur.continue(); }catch(e){ echec(e); }
    };
    tx.oncomplete = () => { if(fini) return; fini = true; clearTimeout(garde); res(); };
    tx.onerror = () => echec(tx.error); tx.onabort = () => echec(tx.error);
  });
}
/* Vérifie que chaque audit a son résumé. Ils manquent tous à la première ouverture après la mise à jour :
   on les fabrique alors un par un (une seule fois), en relisant chaque audit sans jamais le modifier. */
async function preparerResumes(surProgression){
  const clesAudits = await dbCles("audits");
  const clesResumes = await dbCles("resumes");
  const ontResume = new Set(clesResumes), existent = new Set(clesAudits);
  const manquants = clesAudits.filter((k) => !ontResume.has(k));
  const orphelins = clesResumes.filter((k) => !existent.has(k));
  let fait = 0;
  for(const id of manquants){
    if(surProgression) surProgression(fait, manquants.length);
    const p = new Promise((res, rej) => {
      const tx = db.transaction(["audits", "resumes"], "readwrite");
      const r = tx.objectStore("audits").get(id);
      r.onsuccess = () => { if(r.result) tx.objectStore("resumes").put(allege(r.result)); };
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
    const r = await avecDelai(p, 15000);
    if(r.etat !== "ok") throw new Error("résumé impossible pour l'audit " + id);
    fait++;
  }
  if(orphelins.length){
    const p = new Promise((res, rej) => {
      const tx = db.transaction("resumes", "readwrite");
      orphelins.forEach((id) => tx.objectStore("resumes").delete(id));
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
    await avecDelai(p, 8000);
  }
}
// Liste pour l'accueil : les résumés (rapide). En secours seulement, l'ancienne lecture complète.
async function dbAllLege(){
  if(stockageHS || !db) return cache;
  if(resumesPrets){
    const resumes = await dbLireResumes();
    return resumes === null ? cache : resumes.map(assainir);
  }
  const liste = await dbAll();
  if(liste === null) return cache;
  return liste.map((a) => assainir(allege(a)));
}
async function chargerListe(surProgression){
  if(stockageHS || !db) return cache;
  if(!resumesPrets){
    try{ await preparerResumes(surProgression); resumesPrets = true; }
    catch(e){ console.error(e); }
  }
  return dbAllLege();
}
/* Charge l'audit complet (avec photos). Ne renvoie jamais la copie sans photos de la liste :
   si la lecture échoue, on renonce plutôt que de risquer d'écraser l'original. */
async function chargerComplet(id){
  if(db){
    let complet = await dbGet(id);
    if(!complet){ await new Promise((r) => setTimeout(r, 400)); complet = await dbGet(id); }
    if(complet && !complet._resume) return assainir(complet);
  }
  const enMemoire = cache.find((a) => a.id === id);
  if(enMemoire && !enMemoire._resume) return assainir(enMemoire);   // audit créé pendant le mode mémoire
  return null;
}
/* Le stockage redevient disponible (bouton « Réessayer », ou base ouverte en retard) :
   on enregistre d'abord ce qui n'existait qu'en mémoire, puis on recharge la liste. */
async function recupererStockage(){
  if(!db){ toast("Stockage toujours indisponible — fermez les autres onglets de l'app"); return; }
  const enMemoire = cache.filter((a) => a && !a._resume);
  stockageHS = false;
  for(const a of enMemoire){ await dbPut(a); }
  cache = await chargerListe();
  if(state.view === "list") renderList();
}

/* =====================================================================
   ÉTAT
   ===================================================================== */
const state = { view:"list", auditId:null, sec:0, autoJump:true, photoQid:null, viewer:null,
  fq:0, suiviTab:"evolution", suiviResto:null, grpMois:null, grilleSec:0, filtre:"tout" };
let current = null;         // audit en cours d'édition (complet, avec photos)
let cache = [];             // liste des audits (résumés sans photos)
let saveTimer = null;
let aEnregistrer = null;    // audit modifié qui attend son enregistrement

function setSaveStatus(st){
  const el = document.getElementById("saveState");
  if(!el) return;
  if(st === "saving"){ el.textContent = "Enregistrement…"; }
  else if(st === "saved"){ el.textContent = "✓ Enregistré"; }
  else if(st === "error"){ el.textContent = "⚠ Erreur de sauvegarde"; }
}
function scheduleSave(){
  if(!current) return;
  current.updatedAt = Date.now();
  aEnregistrer = current;       // on retient l'audit lui-même : « current » peut changer avant la fin du délai
  setSaveStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(sauverMaintenant, 300);
}
/* Enregistre tout de suite ce qui attend. Appelé à la fin du délai, mais aussi avant de quitter
   l'audit ou l'app, pour qu'aucune réponse ne reste en suspens. */
function sauverMaintenant(){
  clearTimeout(saveTimer); saveTimer = null;
  const audit = aEnregistrer; aEnregistrer = null;
  if(!audit) return Promise.resolve(true);
  return enregistrer(audit);
}
async function enregistrer(audit){
  try{
    const gs = globalStats(audit);
    // l'heure de début est posée à la première réponse, quelle que soit la façon de répondre (bouton, « Tout Oui », relevé)
    if(!audit.startedAt && gs.done > 0) audit.startedAt = Date.now();
    // l'heure de fin est posée AVANT l'écriture, pour être enregistrée avec la dernière réponse
    if(gs.done === gs.total){ if(!audit.completedAt) audit.completedAt = Date.now(); }
    else delete audit.completedAt;
    const ok = await dbPut(audit);
    if(audit === current) setSaveStatus(ok ? "saved" : "error");
    cloudAuto(audit);
    return ok;
  }
  catch(e){ console.error(e); if(audit === current) setSaveStatus("error"); return false; }
}

/* =====================================================================
   CALCULS (mêmes règles que le fichier Excel : moyenne des % par section)
   ===================================================================== */
function sectionStats(sec, audit){
  let oui = 0, non = 0, na = 0;
  for(const q of sec.questions){
    const a = audit.answers[q.id];
    if(a === "na"){ na++; continue; }
    if(q.inv){ // question inversée : la réponse conforme est « Non »
      if(a === "oui") non++; else if(a === "non") oui++;
    } else {
      if(a === "oui") oui++; else if(a === "non") non++;
    }
  }
  const answered = oui + non;
  const done = answered + na;
  const score = answered ? (oui / answered) * 100 : null;
  const pct = (done / sec.questions.length) * 100;
  return { oui, non, na, total:sec.questions.length, answered, done, score, pct };
}
// parts suit l'ordre de grilleDe(audit) : pour un audit propreté, seulement ses sections
function globalStats(audit){
  const parts = grilleDe(audit).map(s => sectionStats(s, audit));
  const total = parts.reduce((a,p) => a + p.total, 0);
  let scoreBrut;
  if(estProprete(audit)){
    // Audit propreté : chaque question compte autant (part des réponses conformes, N/A et « sans réponse » exclus).
    // Une section d'une seule question ne pèse donc pas autant que les 18 matériels.
    const oui = parts.reduce((a,p) => a + p.oui, 0), repondues = parts.reduce((a,p) => a + p.answered, 0);
    scoreBrut = repondues ? (oui / repondues) * 100 : null;
  } else {
    // Audit classique : moyenne des scores de section (règle du fichier Excel)
    const scores = parts.filter(p => p.score !== null).map(p => p.score);
    scoreBrut = scores.length ? scores.reduce((a,b) => a+b, 0) / scores.length : null;
  }
  const done = parts.reduce((a,p) => a + p.done, 0);
  // Veto HACCP : plafonnement ou malus en cas de non-conformité critique
  const nbCrit = criticalsNC(audit).length;
  let score = scoreBrut, veto = "";
  if(nbCrit > 0 && scoreBrut !== null){
    const v = (reglages().vetocrit || "aucun");
    if(v === "plafond" && scoreBrut > 69){ score = 69; veto = "Score plafonné à 69 % (non-conformité critique HACCP)"; }
    else if(v === "malus"){ score = Math.max(0, scoreBrut - 10 * nbCrit); veto = "Malus appliqué : −10 pts par non-conformité critique (" + nbCrit + ")"; }
  }
  return { parts, score, scoreBrut, veto, pct:total ? (done / total) * 100 : 0, done, total };
}
function criticalsNC(audit){
  const out = [];
  grilleDe(audit).forEach((s) => s.questions.forEach((q) => {
    if(q.crit && audit.answers[q.id] === (q.inv ? "oui" : "non")) out.push(q);
  }));
  return out;
}
function interp(score){
  if(score === null) return { label:"—", color:"#94a3b8" };
  if(score >= 95) return { label:"Excellent", color:"#15803d" };
  if(score >= 90) return { label:"Très bien", color:"#4d7c0f" };
  if(score >= 80) return { label:"Conforme", color:"#0369a1" };
  if(score >= 70) return { label:"À améliorer", color:"#b45309" };
  if(score >= 60) return { label:"Insuffisant", color:"#b91c1c" };
  return { label:"Audit à refaire d'urgence", color:"#7f1d1d" };
}

/* =====================================================================
   OUTILS
   ===================================================================== */
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
}
function toast(msg, duree){   // duree (ms) : plus longue pour un message d'erreur qu'il faut avoir le temps de lire
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), duree || 2200);
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

/* =====================================================================
   PHOTOS : compression locale puis stockage
   ===================================================================== */
function compressImage(img, maxDim, quality, filigrane){
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, c.width, c.height);
  if(filigrane){
    const fs = Math.max(15, Math.round(c.width / 30));
    ctx.font = "600 " + fs + "px Arial";
    ctx.textAlign = "right";
    const y = c.height - fs * 0.7;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(0, y - fs * 1.2, c.width, fs * 1.5);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(filigrane, c.width - fs * 0.6, y);
  }
  return c.toDataURL("image/jpeg", quality);
}
function addPhotos(qid, files){
  if(!current) return;
  let pending = files.length;
  toast("Ajout de " + files.length + " photo" + (files.length > 1 ? "s" : "") + "…");
  for(const f of files){
    if(!f.type.startsWith("image/")){ pending--; continue; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      try{
        const filigrane = (current.restaurant || "") + " — " + new Date().toLocaleString("fr-FR");
        const data = compressImage(img, 1280, 0.72, filigrane);
        (current.photos[qid] = current.photos[qid] || []).push(data);
      }catch(e){ console.error(e); toast("Impossible de traiter une photo"); }
      URL.revokeObjectURL(url);
      pending--;
      if(pending === 0){ scheduleSave(); renderPhotoRow(qid); toast("Photo(s) ajoutée(s) ✓"); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); pending--; if(pending === 0){ scheduleSave(); renderPhotoRow(qid); } };
    img.src = url;
  }
}

/* ---- Graphiques SVG (sans dépendance) ---- */
function svgLigne(serie, fmt){
  const pts = serie.filter((p) => typeof p.val === "number");
  if(pts.length < 2) return `<div class="empty">Il faut au moins deux audits terminés pour tracer une courbe.</div>`;
  const vals = pts.map((p) => p.val);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const marge = (max - min) * 0.14; min -= marge; max += marge;
  const w = 640, hh = 240, mL = 56, mR = 18, mT = 20, mB = 36;
  const xi = (i) => mL + (i * (w - mL - mR)) / Math.max(1, serie.length - 1);
  const yi = (v) => mT + (1 - (v - min) / (max - min)) * (hh - mT - mB);
  let path = "", started = false;
  serie.forEach((p, i) => {
    if(typeof p.val !== "number"){ started = false; return; }
    path += (started ? " L" : " M") + xi(i).toFixed(1) + " " + yi(p.val).toFixed(1);
    started = true;
  });
  const grille = [0, 0.5, 1].map((t) => {
    const v = min + (max - min) * (1 - t);
    return `<line x1="${mL}" x2="${w - mR}" y1="${yi(v).toFixed(1)}" y2="${yi(v).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"></line>
      <text x="${mL - 6}" y="${(yi(v) + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#64748b">${fmt(v)}</text>`;
  }).join("");
  const points = serie.map((p, i) => typeof p.val === "number"
    ? `<circle cx="${xi(i).toFixed(1)}" cy="${yi(p.val).toFixed(1)}" r="4" fill="#0f766e"></circle>
       <text x="${xi(i).toFixed(1)}" y="${hh - 14}" text-anchor="middle" font-size="10" fill="#64748b">${esc(p.label)}</text>` : "").join("");
  const dernier = pts[pts.length - 1];
  const idxD = serie.indexOf(dernier);
  const etiq = `<text x="${Math.min(xi(idxD), w - mR - 4).toFixed(1)}" y="${Math.max(yi(dernier.val) - 10, mT + 8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#0f766e">${fmt(dernier.val)}</text>`;
  return `<svg viewBox="0 0 ${w} ${hh}" style="width:100%;height:auto;" role="img" aria-label="courbe">${grille}
    <path d="${path}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"></path>${points}${etiq}</svg>`;
}
function svgBarresH(items, fmt){
  items = items.filter((x) => typeof x.val === "number");
  if(!items.length) return `<div class="empty">Pas de données</div>`;
  const max = Math.max(...items.map((i) => Math.abs(i.val)), 1);
  const rowH = 30, w = 620, labelW = 128;
  const h = items.length * rowH + 6;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;" role="img" aria-label="barres">`;
  items.forEach((it, i) => {
    const y = i * rowH + 4;
    const bw = Math.max(2, Math.abs(it.val) / max * (w - labelW - 80));
    const couleur = it.couleur || (it.val < 0 ? "#dc2626" : "#0f766e");
    s += `<text x="${labelW - 6}" y="${y + 15}" text-anchor="end" font-size="11.5" fill="currentColor">${esc(it.label)}</text>`;
    s += `<rect x="${labelW}" y="${y + 3}" width="${bw}" height="18" rx="4" fill="${couleur}" opacity=".85"></rect>`;
    s += `<text x="${labelW + bw + 6}" y="${y + 17}" font-size="11.5" font-weight="700" fill="currentColor">${fmt(it.val)}</text>`;
  });
  return s + "</svg>";
}
function dateCourt(iso){
  if(!iso) return "?";
  const p = iso.split("-");
  return p[2] + "/" + p[1];
}

function updateLive(){
  if(!current) return;
  const gs = globalStats(current);
  const chip = document.getElementById("hScore");
  if(chip){
    if(gs.score === null){ chip.textContent = "—"; chip.style.background = "#94a3b8"; }
    else { chip.textContent = Math.round(gs.score) + "%"; chip.style.background = interp(gs.score).color; }
  }
  const bar = document.getElementById("hBar");
  if(bar) bar.style.width = gs.pct + "%";
  const G = grilleDe(current);
  G.forEach((s, i) => {
    const el = document.getElementById("chip-" + i);
    if(!el) return;
    const sti = sectionStats(s, current);
    const c = el.querySelector(".cnt");
    if(c) c.textContent = sti.done + "/" + sti.total;
    el.classList.toggle("done", sti.done === sti.total);
  });
  if(G[state.sec]){
    const st = sectionStats(G[state.sec], current);
    const ss = document.getElementById("secScore");
    if(ss){
      if(st.score === null){ ss.textContent = "—"; ss.style.background = "#94a3b8"; }

  }
}

function posSur(cv, e){
  const rect = cv.getBoundingClientRect();
  return { x:(e.clientX - rect.left) * cv.width / rect.width, y:(e.clientY - rect.top) * cv.height / rect.height };
}
function initSignatures(audit){
  document.querySelectorAll(".sigpad").forEach((cv) => {
    const role = cv.dataset.role;
    // L'image enregistrée prend les proportions de la zone affichée : la signature n'est plus étirée dans le rapport
    const zone = cv.getBoundingClientRect();
    const densite = Math.min(window.devicePixelRatio || 1, 3);
    if(zone.width > 0 && zone.height > 0){
      cv.width = Math.round(zone.width * densite);
      cv.height = Math.round(zone.height * densite);
    }
    const ctx = cv.getContext("2d");
    ctx.lineWidth = 2 * densite; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0f172a";
    const sig = (audit.signatures || {})[role];
    if(sig){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, cv.width, cv.height); img.src = sig; }
    let dessine = false;
    cv.onpointerdown = (e) => {
      dessine = true;
      const pos = posSur(cv, e);
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    };
    cv.onpointermove = (e) => {
      if(!dessine) return;
      const pos = posSur(cv, e);
      ctx.lineTo(pos.x, pos.y); ctx.stroke();
    };
    const fin = () => {
      if(!dessine) return;
      dessine = false;
      audit.signatures = audit.signatures || {};
      audit.signatures[role] = cv.toDataURL("image/png");
      // on retient la date de la signature et l'état de l'audit à ce moment-là
      audit.sigInfos = audit.sigInfos || {};
      audit.sigInfos[role] = { le: Date.now(), empreinte: empreinteAudit(audit) };
      scheduleSave();
      majEtatSignatures(audit);
    };
    cv.onpointerup = fin;
    cv.onpointercancel = fin;   // geste interrompu par le système : on garde quand même le tracé
  });
}

async function exportJSON(){

  toast("Préparation de la sauvegarde…");
  // Le fichier est assemblé audit par audit, toujours à partir des audits complets (avec photos).

  const morceaux = ['{"app":"audit-cuisine","version":1,"exports":['];
  const vus = {};
  let n = 0;
  const ajouter = (rec) => { if(!rec || rec._resume || vus[rec.id]) return; vus[rec.id] = true; morceaux.push((n ? "," : "") + JSON.stringify(rec)); n++; };
  if(db) await dbParcourir(ajouter);

  if(n === 0 && (stockageHS || !db)) throw new Error("stockage de l'appareil indisponible");   // pas de sauvegarde vide trompeuse
  morceaux.push("]}");
  download(new Blob(morceaux, { type:"application/json" }), "audit-cuisine-sauvegarde-" + todayISO() + ".json");
  toast("Sauvegarde téléchargée ✓ (" + n + " audit" + (n > 1 ? "s" : "") + ")");

function exportCSV(){
  if(!current) return;
  const lines = ["Restaurant;Date;Auditeur;Section;Question;Reponse;Commentaire;Nb photos"];
  grilleDe(current).forEach(s => s.questions.forEach(q => {
    const a = current.answers[q.id] || "";
    const rep = a === "oui" ? "Oui" : a === "non" ? "Non" : a === "na" ? "N/A" : "";
    lines.push([
      current.restaurant, current.date, current.auditor, s.title, q.t, rep,
      (current.notes[q.id] || "").replace(/[\r\n;]+/g, " "),
      (current.photos[q.id] || []).length
    ].map(v => { v = String(v == null ? "" : v); return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";"));
  }));
  const gs = globalStats(current);
  lines.push("");
  lines.push("SCORE GLOBAL;;;;;" + (gs.score === null ? "" : Math.round(gs.score) + " %") + ";" + interp(gs.score).label);
  if(estProprete(current)) lines.push("TYPE D'AUDIT;;;;;Propreté");
  download(new Blob(["\uFEFF" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" }),
    (estProprete(current) ? "audit-proprete-" : "audit-") + safeName(current.restaurant) + "-" + current.date + ".csv");
}

  const html = buildReportHtml(current);
  const name = (estProprete(current) ? "audit-proprete-" : "audit-") + safeName(current.restaurant) + "-" + current.date + ".html";
  try{

      await navigator.share({ files:[file], title:"Audit " + (current.restaurant || "") });
