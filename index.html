<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#0f766e"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<meta name="format-detection" content="telephone=no"/>
<title>Audit Cuisine</title>
<style>
  :root{
    --brand:#0f766e; --brand-dark:#115e59; --brand-soft:#ccfbf1;
    --bg:#eef2f6; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.45;
  }
  button{font-family:inherit; touch-action:manipulation; cursor:pointer;}
  .wrap{max-width:640px; margin:0 auto; padding:0 14px calc(90px + env(safe-area-inset-bottom));}
  .hide{display:none !important;}

  /* ---------- Barre du haut ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .tb-in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:10px;}
  .tb-back{border:none; background:var(--brand-soft); color:var(--brand-dark); width:38px; height:38px;
    border-radius:12px; font-size:19px; flex:none;}
  .tb-title{flex:1; min-width:0;}
  .tb-title b{display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-title small{color:var(--muted); font-size:12.5px;}
  .scorechip{color:#fff; font-weight:700; font-size:14px; padding:5px 11px; border-radius:999px; background:#94a3b8; flex:none;}
  .progress{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px; max-width:640px; margin-left:auto; margin-right:auto;}
  .progress i{display:block; height:100%; width:0%; background:var(--brand); border-radius:99px; transition:width .25s;}
  .savestate{font-size:11px; color:var(--muted); text-align:right; margin-top:4px; max-width:640px; margin-left:auto; margin-right:auto;}

  /* ---------- Chips de sections ---------- */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 14px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; position:sticky; top:calc(64px + env(safe-area-inset-top)); z-index:25;
    background:linear-gradient(var(--bg) 82%, transparent);}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; display:flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:#fff;
    border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; color:#334155;}
  .chip .cnt{font-weight:700; color:var(--muted); font-size:11.5px; background:var(--bg); border-radius:99px; padding:2px 7px;}
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .chip.active .cnt{background:rgba(255,255,255,.25); color:#fff;}
  .chip.done{border-color:var(--ok);}
  .chip.done .cnt{background:#dcfce7; color:#166534;}

  /* ---------- Cartes de questions ---------- */
  .sec-head{display:flex; align-items:center; gap:10px; margin:16px 2px 4px;}
  .sec-head h2{font-size:18px; margin:0; flex:1; line-height:1.3;}
  .sec-head .scorechip{font-size:13px;}
  .sec-bar{height:5px; background:var(--line); border-radius:99px; overflow:hidden; margin:6px 2px 2px;}
  .sec-bar i{display:block; height:100%; width:0%; background:var(--brand); transition:width .25s;}
  .sec-warn{color:var(--warn); font-size:13px; font-weight:600; margin:8px 2px 0;}
  .group-label{margin:18px 2px 8px; padding:8px 12px; background:#e0f2fe; color:#075985;
    border-radius:10px; font-size:13.5px; font-weight:700;}
  .qcard{background:var(--card); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .qtop{display:flex; gap:10px; margin-bottom:11px;}
  .qnum{flex:none; width:26px; height:26px; border-radius:9px; background:var(--brand-soft); color:var(--brand-dark);
    font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .qtext{font-size:15px; font-weight:600; line-height:1.4;}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .seg .b{border:1.5px solid var(--line); background:#f8fafc; border-radius:12px; padding:10px 4px;
    font-size:14.5px; font-weight:700; color:#475569; display:flex; align-items:center; justify-content:center; gap:7px; min-height:46px;}
  .seg .b span{font-size:14.5px;}
  .b-oui.sel{background:#dcfce7; border-color:var(--ok); color:#166534;}
  .b-non.sel{background:#fee2e2; border-color:var(--bad); color:#991b1b;}
  .b-na.sel{background:#e2e8f0; border-color:#94a3b8; color:#334155;}
  /* Question inversée : « Non » est la réponse conforme (vert), « Oui » est un défaut (rouge) */
  .qcard.inv .b-non.sel{background:#dcfce7; border-color:var(--ok); color:#166534;}
  .qcard.inv .b-oui.sel{background:#fee2e2; border-color:var(--bad); color:#991b1b;}
  .note{width:100%; min-height:64px; margin-top:10px; border:1.5px solid var(--line); border-radius:12px;
    padding:9px 11px; font-size:16px; font-family:inherit; resize:vertical; background:#fffbeb;}
  .phrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center;}
  .phwrap{position:relative; display:inline-block;}
  .ph{width:62px; height:62px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block;}
  .phdel{position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:99px; border:none;
    background:#0f172a; color:#fff; font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .addph{border:1.5px dashed #94a3b8; background:#f8fafc; color:#475569; border-radius:10px;
    padding:9px 13px; font-size:13.5px; font-weight:600;}

  /* ---------- Pied de navigation ---------- */
  .footerbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .fb-in{max-width:640px; margin:0 auto; display:flex; gap:10px;}
  .fbtn{flex:1; border:none; border-radius:13px; padding:13px 8px; font-size:14.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:2px; min-height:52px; justify-content:center;}
  .fbtn small{font-size:11px; font-weight:600; opacity:.75; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fbtn.ghost{background:#f1f5f9; color:#334155;}
  .fbtn.primary{background:var(--brand); color:#fff;}

  /* ---------- Accueil ---------- */
  .home-head{padding:26px 2px 8px;}
  .home-head h1{margin:0; font-size:24px;}
  .home-head p{margin:6px 0 0; color:var(--muted); font-size:14px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:13px;
    padding:13px 18px; font-size:15px; font-weight:700; min-height:48px;}
  .btn.primary{background:var(--brand); color:#fff;}
  .btn.ghost{background:#fff; color:#334155; border:1.5px solid var(--line);}
  .btn.danger{background:#fee2e2; color:#991b1b;}
  .btn.block{width:100%;}
  .card{background:var(--card); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .card-head{display:flex; align-items:flex-start; gap:10px; cursor:pointer;}
  .card-title{font-size:16.5px; font-weight:800; margin:0;}
  .meta{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:10px;}
  .bar i{display:block; height:100%; border-radius:99px; background:var(--brand); transition:width .25s;}
  .row-actions{display:flex; gap:7px; margin-top:12px; flex-wrap:wrap;}
  .row-actions .btn{padding:9px 12px; font-size:13px; min-height:40px; border-radius:10px; flex:1;}
  .empty{text-align:center; padding:40px 10px; color:var(--muted);}
  .tip{font-size:12.5px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.5;}
  .tools{display:flex; gap:8px; margin-top:14px;}
  .tools .btn{flex:1; font-size:12.5px; padding:10px 6px; min-height:42px;}

  /* ---------- Rapport ---------- */
  .rep-hero{background:var(--card); border-radius:18px; padding:20px; margin:16px 0 10px; text-align:center;
    box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .gauge{position:relative; width:150px; height:150px; margin:6px auto 4px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .gval{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge .gval b{font-size:34px; line-height:1;}
  .gauge .gval small{color:var(--muted); font-size:12px; margin-top:3px;}
  .interp{display:inline-block; color:#fff; font-weight:800; font-size:15px; padding:7px 16px; border-radius:999px; margin-top:8px;}
  .rep-meta{text-align:center; color:var(--muted); font-size:13px; margin:4px 0 14px;}
  .secrow{background:var(--card); border-radius:13px; padding:11px 13px; margin:8px 0; box-shadow:0 1px 3px rgba(15,23,42,.07);}
  .secrow .sr-top{display:flex; align-items:center; gap:8px;}
  .secrow .sr-top b{flex:1; font-size:13.5px; line-height:1.35;}
  .secrow .scorechip{font-size:12px; padding:3px 9px;}
  .secrow .bar{margin-top:8px;}
  .rep-actions{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:16px 0 6px;}
  .nc-sec{margin-top:20px;}
  .nc-sec h3{font-size:15.5px; margin:0 0 8px;}
  .nc-item{background:var(--card); border-left:4px solid var(--bad); border-radius:12px; padding:11px 13px; margin:8px 0;
    box-shadow:0 1px 3px rgba(15,23,42,.07); break-inside:avoid;}
  .nc-item p{margin:0; font-size:14px; font-weight:600;}
  .nc-note{margin:7px 0 0; font-size:13px; color:#7c2d12; background:#fffbeb; border-radius:8px; padding:7px 9px;}
  .nc-photos{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .nc-photos img{width:74px; height:74px; object-fit:cover; border-radius:9px; border:1px solid var(--line);}
  .rep-ok{color:var(--ok); font-weight:700; text-align:center; padding:18px 0 8px; font-size:15px;}
  .legend{color:var(--muted); font-size:12px; text-align:center; margin-top:16px; line-height:1.5;}

  /* ---------- Modale / visionneuse / toast ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60; display:flex;
    align-items:flex-end; justify-content:center; padding:0;}
  @media (min-width:520px){ .modal-bg{align-items:center; padding:20px;} }
  .sheet{background:#fff; width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:20px;
    max-height:88vh; overflow:auto;}
  @media (min-width:520px){ .sheet{border-radius:20px;} }
  .sheet h3{margin:0 0 14px; font-size:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; font-weight:700; color:#334155; margin-bottom:5px;}
  .field input{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:11px 12px;
    font-size:16px; font-family:inherit;}
  .sheet .btn{width:100%; margin-top:6px;}
  .viewer{position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:80; display:flex;
    flex-direction:column; align-items:center; justify-content:center; padding:16px;}
  .viewer img{max-width:100%; max-height:78vh; border-radius:10px;}
  .viewer-actions{display:flex; gap:10px; margin-top:14px;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom));
    background:#0f172a; color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    z-index:99; opacity:0; pointer-events:none; transition:opacity .25s; max-width:86vw; text-align:center;}
  .toast.show{opacity:.96;}

  .actrow{display:flex; gap:6px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  .actrow input{border:1.5px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; flex:1; min-width:110px; font-family:inherit;}
  .actstatut{border:none; border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:800; background:#fee2e2; color:#991b1b; min-height:38px;}
  .actstatut.fait{background:#dcfce7; color:#166534;}
  .fpos{flex:none; font-weight:800; font-size:14px; color:#334155; padding:0 6px; display:flex; align-items:center;}
  .setrow{display:flex; align-items:center; gap:10px; margin:12px 0; font-size:14px; flex-wrap:wrap;}
  .setrow input[type="checkbox"]{width:20px; height:20px;}
  .pl-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .pl-item:last-child{border-bottom:none;}
  .pl-statut{font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; flex:none;}
  .rep-logo{max-height:64px; max-width:180px; object-fit:contain; display:block; margin:0 auto 8px;}
  .toutoui{border:1.5px solid var(--ok); background:#f0fdf4; color:#166534; border-radius:10px;
    padding:7px 12px; font-size:12.5px; font-weight:800; flex:none;}
  .cqrow{display:flex; gap:8px; margin:8px 0; align-items:center;}
  .cqrow input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; font-family:inherit;}
  .cqdel{border:none; background:#fee2e2; color:#991b1b; width:32px; height:32px; border-radius:9px; font-size:15px; flex:none;}
  .delta{font-size:11px; font-weight:800; margin-left:6px;}
  .rappel{background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; border-radius:8px;
    padding:6px 9px; font-size:12.5px; margin-bottom:9px; font-weight:600;}
  .crit-banner{background:#dc2626; color:#fff; border-radius:12px; padding:11px 14px;
    font-weight:800; font-size:13.5px; margin:10px 0 2px; text-align:left;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag{border:1.5px solid var(--brand); background:var(--brand-soft); color:var(--brand-dark);
    border-radius:99px; padding:5px 10px; font-size:11.5px; font-weight:700;}
  .chipgrp{display:flex; gap:5px; align-items:center; flex-wrap:wrap; width:100%;}
  .chiplab{font-size:11.5px; font-weight:800; color:var(--muted); width:52px; flex:none;}
  .qchip{border:1.5px solid var(--line); background:#f8fafc; border-radius:99px;
    padding:5px 10px; font-size:11.5px; font-weight:700; color:#475569;}
  .qchip.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  .sigrow{display:flex; gap:10px;}
  .sigbox{flex:1; text-align:center; min-width:0;}
  .sigpad{width:100%; height:90px; border:1.5px dashed var(--line); border-radius:10px;
    background:#fff; touch-action:none; display:block;}
  .sigbox small{display:block; margin:4px 0; color:var(--muted); font-weight:700;}
  .noterow{display:flex; gap:6px; align-items:stretch;}
  .noterow .note{flex:1;}
  .mic{flex:none; width:46px; border:1.5px solid var(--line); background:#fff; border-radius:10px; font-size:18px;}
  .mic.ecoute{background:#dc2626; border-color:#dc2626; color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.6;}}
  .mesure{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .mesure input{width:110px; border:1.5px solid #0369a1; background:#f0f9ff; color:#075985; border-radius:10px;
    padding:8px 10px; font-size:15px; font-weight:700; font-family:inherit;}
  .mesure span{font-size:12px; font-weight:800; color:#0369a1;}
  .recidive{background:#7c2d12; color:#fff; border-radius:6px; padding:2px 8px; font-size:11px;
    font-weight:800; margin-left:6px; white-space:nowrap;}
  .up{color:var(--ok);}
  .down{color:var(--bad);}
  .navrow{display:flex; gap:6px; overflow-x:auto; padding:8px 2px 4px; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navchip,.vetochip{border:1.5px solid var(--line); background:#fff; border-radius:99px;
    padding:6px 12px; font-size:12.5px; font-weight:700; color:#475569; flex:none;}
  .navchip.active,.vetochip.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  .critphoto{display:block; width:100%; background:#fff7ed; color:#9a3412; border:2px solid #f97316;
    border-radius:10px; padding:9px 10px; font-size:12.5px; font-weight:800; margin-top:8px;
    animation:clignote 1.3s infinite;}
  @keyframes clignote{50%{background:#fed7aa;}}
  .outils{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center;}
  .outil{border:1.5px solid var(--line); background:#fff; color:#334155; border-radius:10px;
    padding:8px 12px; font-size:13px; font-weight:700;}
  .outil.sel{background:var(--brand); border-color:var(--brand); color:#fff;}
  #annCv{max-width:96vw; max-height:62vh; border-radius:10px; touch-action:none; cursor:crosshair;}
  @media print{
    .noprint{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none; padding:0;}
    .rep-hero,.secrow,.nc-item{box-shadow:none; border:1px solid #e2e8f0;}
  }
</style>
</head>

<script>
"use strict";

/* Configuration du relais (sauvegarde en ligne des audits) */
const RELAIS_CLOUD = "https://script.google.com/macros/s/AKfycbzqmp8Dnh7b8Sh1pfEjc2xczoJyfXN7ctmNay7aOe2wnrOBSfGsUx11zZfxJ2h4H1L9/exec";
const CLE_CLOUD_DEFAUT = "f65bca368ee2";

/* =====================================================================
   DONNÉES : les 13 sections de l'audit (issues du fichier Excel d'origine)
   ===================================================================== */
const SECTIONS = [
  { icon:"🚚", title:"Contrôle et réception des livraisons", short:"Livraisons", questions:[
    { t:"Le relevé des températures du camion est-il fait auprès du livreur ?", mesure:{unite:"°C", seuil:4, sens:"max"} },
    { t:"Est-ce qu'un cuisinier range rapidement les livraisons ?" },
    { t:"Les thermomètres sont-ils en état de fonctionnement (sonde + laser) ?" },
    { t:"Les produits sont-ils stockés correctement dans les chambres froides ? (aucun produit au sol)" },
    { t:"Les produits sont-ils correctement protégés ? (pas de produit à l'air libre)" },
    { t:"Les cartons en chambre froide positive sont-ils stockés sur l'étagère basse ?" },
  ]},
  { icon:"🧾", title:"Les auto-contrôles de cuisine", short:"Auto-contrôles", questions:[
    { t:"L'équipe est-elle autonome sur Traqfood ?" },
    { t:"Les remises en température sont-elles faites correctement ? (+63 °C en moins d'une heure)", crit:true, mesure:{unite:"°C", seuil:63, sens:"min"} },
    { t:"Les descentes en température sont-elles faites correctement ? (en dessous de 10 °C en moins de 2 heures)", crit:true, mesure:{unite:"°C", seuil:10, sens:"max"} },
    { t:"Les tests d'huiles sont-ils faits tous les jours ?", mesure:{unite:"% TPM", seuil:24, sens:"max"} },
    { t:"La filtration est-elle faite tous les jours ?" },

let db = null;
function openDB(){
  return new Promise((resolve) => {
    try{
      const req = indexedDB.open("audit-cuisine-db", 1);
      req.onupgradeneeded = () => { req.result.createObjectStore("audits", { keyPath:"id" }); };
      req.onsuccess = () => { db = req.result; resolve(true); };
      req.onerror = () => resolve(false);
    }catch(e){ resolve(false); }
  });
}
function dbPut(rec){ return new Promise((res, rej) => { const tx = db.transaction("audits","readwrite"); tx.objectStore("audits").put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
function dbAll(){ return new Promise((res, rej) => { const tx = db.transaction("audits","readonly"); const r = tx.objectStore("audits").getAll(); tx.oncomplete = () => res(r.result || []); tx.onerror = () => rej(tx.error); }); }
function dbGet(id){ return new Promise((res, rej) => { const tx = db.transaction("audits","readonly"); const r = tx.objectStore("audits").get(id); tx.oncomplete = () => res(r.result); tx.onerror = () => rej(tx.error); }); }
function dbDel(id){ return new Promise((res, rej) => { const tx = db.transaction("audits","readwrite"); tx.objectStore("audits").delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

/* =====================================================================
   CALCULS (mêmes règles que le fichier Excel : moyenne des % par section)
   ===================================================================== */
function sectionStats(sec, audit){
  let oui = 0, non = 0, na = 0;
  for(const q of sec.questions){
    const a = audit.answers[q.id];
    if(a === "na"){ na++; continue; }
    if(q.inv){ // question inversée : la réponse conforme est « Non »
      if(a === "oui") non++; else if(a === "non") oui++;
    } else {
      if(a === "oui") oui++; else if(a === "non") non++;
    }
  }
  const answered = oui + non;
  const done = answered + na;
  const score = answered ? (oui / answered) * 100 : null;
  const pct = (done / sec.questions.length) * 100;
  return { oui, non, na, total:sec.questions.length, answered, done, score, pct };
}
function globalStats(audit){
  const parts = SECTIONS.map(s => sectionStats(s, audit));
  const scores = parts.filter(p => p.score !== null).map(p => p.score);
  const scoreBrut = scores.length ? scores.reduce((a,b) => a+b, 0) / scores.length : null;
  const done = parts.reduce((a,p) => a + p.done, 0);
  // Veto HACCP : plafonnement ou malus en cas de non-conformité critique
  const nbCrit = criticalsNC(audit).length;
  let score = scoreBrut, veto = "";
  if(nbCrit > 0 && scoreBrut !== null){
    const v = (reglages().vetocrit || "aucun");
    if(v === "plafond" && scoreBrut > 69){ score = 69; veto = "Score plafonné à 69 % (non-conformité critique HACCP)"; }
    else if(v === "malus"){ score = Math.max(0, scoreBrut - 10 * nbCrit); veto = "Malus appliqué : −10 pts par non-conformité critique (" + nbCrit + ")"; }
  }
  return { parts, score, scoreBrut, veto, pct:(done / TOTAL_Q) * 100, done };
}
function criticalsNC(audit){
  const out = [];
  SECTIONS.forEach((s) => s.questions.forEach((q) => {
    if(q.crit && audit.answers[q.id] === (q.inv ? "oui" : "non")) out.push(q);
  }));
  return out;
}
function interp(score){
  if(score === null) return { label:"—", color:"#94a3b8" };
  if(score >= 95) return { label:"Excellent", color:"#15803d" };
  if(score >= 90) return { label:"Très bien", color:"#4d7c0f" };
  if(score >= 80) return { label:"Conforme", color:"#0369a1" };
  if(score >= 70) return { label:"À améliorer", color:"#b45309" };
  if(score >= 60) return { label:"Insuffisant", color:"#b91c1c" };
  return { label:"Audit à refaire d'urgence", color:"#7f1d1d" };
}

/* =====================================================================
   PHOTOS : compression locale puis stockage
   ===================================================================== */
function compressImage(img, maxDim, quality, filigrane){
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, c.width, c.height);
  if(filigrane){
    const fs = Math.max(15, Math.round(c.width / 30));
    ctx.font = "600 " + fs + "px Arial";
    ctx.textAlign = "right";
    const y = c.height - fs * 0.7;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(0, y - fs * 1.2, c.width, fs * 1.5);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(filigrane, c.width - fs * 0.6, y);
  }
  return c.toDataURL("image/jpeg", quality);
}
function addPhotos(qid, files){
  if(!current) return;
  let pending = files.length;
  toast("Ajout de " + files.length + " photo" + (files.length > 1 ? "s" : "") + "…");
  for(const f of files){
    if(!f.type.startsWith("image/")){ pending--; continue; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      try{
        const filigrane = (current.restaurant || "") + " — " + new Date().toLocaleString("fr-FR");
        const data = compressImage(img, 1280, 0.72, filigrane);
        (current.photos[qid] = current.photos[qid] || []).push(data);
      }catch(e){ console.error(e); toast("Impossible de traiter une photo"); }
      URL.revokeObjectURL(url);
      pending--;
      if(pending === 0){ scheduleSave(); renderPhotoRow(qid); toast("Photo(s) ajoutée(s) ✓"); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); pending--; if(pending === 0){ scheduleSave(); renderPhotoRow(qid); } };
    img.src = url;
  }
}

/* ---- Graphiques SVG (sans dépendance) ---- */
function svgLigne(serie, fmt){
  const pts = serie.filter((p) => typeof p.val === "number");
  if(pts.length < 2) return `<div class="empty">Pas assez d'audits pour tracer une courbe.</div>`;
  const vals = pts.map((p) => p.val);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const marge = (max - min) * 0.14; min -= marge; max += marge;
  const w = 640, hh = 240, mL = 56, mR = 18, mT = 20, mB = 36;
  const xi = (i) => mL + (i * (w - mL - mR)) / Math.max(1, serie.length - 1);
  const yi = (v) => mT + (1 - (v - min) / (max - min)) * (hh - mT - mB);
  let path = "", started = false;
  serie.forEach((p, i) => {
    if(typeof p.val !== "number"){ started = false; return; }
    path += (started ? " L" : " M") + xi(i).toFixed(1) + " " + yi(p.val).toFixed(1);
    started = true;
  });
  const grille = [0, 0.5, 1].map((t) => {
    const v = min + (max - min) * (1 - t);
    return `<line x1="${mL}" x2="${w - mR}" y1="${yi(v).toFixed(1)}" y2="${yi(v).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"></line>
      <text x="${mL - 6}" y="${(yi(v) + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#64748b">${fmt(v)}</text>`;
  }).join("");
  const points = serie.map((p, i) => typeof p.val === "number"
    ? `<circle cx="${xi(i).toFixed(1)}" cy="${yi(p.val).toFixed(1)}" r="4" fill="#0f766e"></circle>
       <text x="${xi(i).toFixed(1)}" y="${hh - 14}" text-anchor="middle" font-size="10" fill="#64748b">${esc(p.label)}</text>` : "").join("");
  const dernier = pts[pts.length - 1];
  const idxD = serie.indexOf(dernier);
  const etiq = `<text x="${Math.min(xi(idxD), w - mR - 4).toFixed(1)}" y="${Math.max(yi(dernier.val) - 10, mT + 8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#0f766e">${fmt(dernier.val)}</text>`;
  return `<svg viewBox="0 0 ${w} ${hh}" style="width:100%;height:auto;" role="img" aria-label="courbe">${grille}
    <path d="${path}" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"></path>${points}${etiq}</svg>`;
}
function svgBarresH(items, fmt){
  items = items.filter((x) => typeof x.val === "number");
  if(!items.length) return `<div class="empty">Pas de données</div>`;
  const max = Math.max(...items.map((i) => Math.abs(i.val)), 1);
  const rowH = 30, w = 620, labelW = 128;
  const h = items.length * rowH + 6;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;" role="img" aria-label="barres">`;
  items.forEach((it, i) => {
    const y = i * rowH + 4;
    const bw = Math.max(2, Math.abs(it.val) / max * (w - labelW - 80));
    const couleur = it.couleur || (it.val < 0 ? "#dc2626" : "#0f766e");
    s += `<text x="${labelW - 6}" y="${y + 15}" text-anchor="end" font-size="11.5" fill="currentColor">${esc(it.label)}</text>`;
    s += `<rect x="${labelW}" y="${y + 3}" width="${bw}" height="18" rx="4" fill="${couleur}" opacity=".85"></rect>`;
    s += `<text x="${labelW + bw + 6}" y="${y + 17}" font-size="11.5" font-weight="700" fill="currentColor">${fmt(it.val)}</text>`;
  });
  return s + "</svg>";
}
function dateCourt(iso){
  if(!iso) return "?";
  const p = iso.split("-");
  return p[2] + "/" + p[1];
}

    <div class="tb-title"><b>🧑‍🍳 Audit Cuisine</b><small>HACCP · auto-évaluation restaurant</small></div>
    <button class="tb-back" data-action="open-suivi" title="Suivi des audits">📊</button>
    <button class="tb-back" data-action="settings" title="Réglages">⚙️</button>
  </div></div>
  <div class="wrap">
    <div class="home-head">
      <h1>Mes audits</h1>
      <p>${cache.length} audit${cache.length > 1 ? "s" : ""} enregistré${cache.length > 1 ? "s" : ""} sur cet appareil · ${TOTAL_Q} questions réparties en ${SECTIONS.length} sections</p>
    </div>
    <button class="btn primary block" data-action="new-audit">＋&nbsp; Nouvel audit</button>`;
  if(enCours){
    const gs = globalStats(enCours);
    html += `<button class="btn ghost block" data-action="open-audit" data-id="${enCours.id}" style="margin-top:8px;">
      ▶ Reprendre : ${esc(enCours.restaurant || "Audit")} · ${gs.done}/${TOTAL_Q} répondues</button>`;
  }
  if(cache.length === 0){
    html += `<div class="empty">Aucun audit pour l'instant.<br>Creez votre premier audit : il sera sauvegardé automatiquement sur l'appareil.</div>`;
  }
  for(const a of cache){
    const gs = globalStats(a);
    const ic = interp(gs.score);
    const nbCrit = criticalsNC(a).length;
    const anterieurs = cache.filter((x) => x.id !== a.id
      && (x.restaurant || "").trim() === (a.restaurant || "").trim()
      && globalStats(x).score !== null
      && ((x.date || "") < (a.date || "") || ((x.date || "") === (a.date || "") && (x.createdAt || 0) < (a.createdAt || 0))))
      .sort((x, y) => ((y.date || "") + y.createdAt).localeCompare((x.date || "") + x.createdAt));
    let deltaHtml = "";
    if(anterieurs.length){
      const s1 = globalStats(anterieurs[0]).score, s2 = gs.score;
      if(s1 !== null && s2 !== null){
        const d = Math.round(s2 - s1);
        if(Math.abs(d) >= 1) deltaHtml = `<span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : ""}${d} pts ${d >= 0 ? "↗" : "↘"}</span>`;
      }
    }
    html += `
    <div class="card">
      <div class="card-head" data-action="open-audit" data-id="${a.id}">
        <div style="flex:1; min-width:0;">
          <p class="card-title">${esc(a.restaurant || "Audit sans nom")}${nbCrit ? ` <span style="color:var(--bad);">⚠️ critique</span>` : ""}${a.suiviDe ? ` <span style="color:var(--warn); font-size:12px;">🔁 contre-visite</span>` : ""}</p>
          <div class="meta">${fmtDate(a.date)} · ${gs.done}/${TOTAL_Q} répondues${a.cloudOk ? " · ☁️" : ""}</div>
          <div class="bar"><i style="width:${gs.pct}%; background:${ic.color};"></i></div>
        </div>
        <span class="scorechip" style="background:${ic.color};">${gs.score === null ? "—" : Math.round(gs.score) + "%"}${deltaHtml}</span>
      </div>
      <div class="row-actions">
        <button class="btn ghost" data-action="open-audit" data-id="${a.id}">${gs.done < TOTAL_Q ? "✏️ Continuer" : "📂 Ouvrir"}</button>
        <button class="btn ghost" data-action="open-report" data-id="${a.id}">📊 Rapport</button>
        <button class="btn ghost" data-action="suivi-audit" data-id="${a.id}">🔁 Contre-visite</button>
        <button class="btn ghost" data-action="cloud-save" data-id="${a.id}" title="Sauvegarder en ligne">${a.cloudOk ? "☁️✓" : "☁️"}</button>
        <button class="btn ghost" data-action="dup-audit" data-id="${a.id}">⧉ Dupliquer</button>
        <button class="btn danger" data-action="del-audit" data-id="${a.id}">🗑</button>
      </div>
    </div>`;
  }
  html += `
    <div class="tools">
      <button class="btn ghost" data-action="export-json">⬇️ Sauvegarde (fichier)</button>
      <button class="btn ghost" data-action="import-json">⬆️ Importer</button>
      <button class="btn ghost" data-action="cloud-restore">☁️ Restaurer (cloud)</button>
      <button class="btn ghost" data-action="cloud-sync">🔄 Tout synchroniser</button>
    </div>
    <p class="tip">💡 Tout est enregistré automatiquement sur l'appareil, sans connexion internet.<br>
    Sur iPhone/Android : menu du navigateur → « Ajouter à l'écran d'accueil » pour l'utiliser comme une application.</p>
  </div>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ---------- Écran audit : une section à la fois (ou une question en mode focus) ---------- */
const TAGS_AUDIT = ["DLC absente", "Joint encrassé", "Pas filmé", "À dégraisser"];
const TAGS_POSTES = ["Film déchiré", "DLC dépassée", "Produit non étiqueté"];
const TAGS_PAR_SECTION = {
  1: ["Camion non réfrigéré", "Réception non contrôlée", "Cartons au sol"],
  2: ["Relevé manquant", "Traqfood non à jour", "Produit non étiqueté"],
  3: ["DLC dépassée", "Absence d'étiquette", "Film déchiré"],
  4: TAGS_POSTES, 5: TAGS_POSTES, 6: TAGS_POSTES, 7: TAGS_POSTES, 8: TAGS_POSTES, 9: TAGS_POSTES,
  10: ["Barbe non couverte", "Bijou ou montre", "Chaussures non conformes"],
  11: ["Joint moisi", "Graisse figée", "Calcaire"],
  12: ["Joint moisi", "Graisse figée", "Calcaire"],
  13: ["Attente du passe", "Grammage non respecté", "Température à cœur < 63 °C"]
};
const VocalDispo = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function qCardHtml(q, num, audit){
  const a = audit.answers[q.id] || "";
  const noteVal = audit.notes[q.id] || "";
  const photos = audit.photos[q.id] || [];
  const act = (audit.actions || {})[q.id] || {};
  const defaut = audit.answers[q.id] === (q.inv ? "oui" : "non");
  const rem = (audit.rappels || {})[q.id];
  const echeances = [["Immédiat", 0], ["48 h", 2], ["7 jours", 7], ["Prochain audit", "audit"]];
  const numSec = state.sec + 1;
  const tagsList = TAGS_PAR_SECTION[numSec] || TAGS_AUDIT;
  const mesv = (audit.mesures || {})[q.id] || "";
  return `
  <div class="qcard ${q.inv ? "inv" : ""}" data-qid="${q.id}">
    ${q.group ? `<div class="group-label">${esc(q.group)}</div>` : ""}
    <div class="qtop">
      <span class="qnum">${num}</span>
      <div class="qtext">${esc(q.t)}${q.crit ? ` <span style="color:var(--bad); font-weight:800;">🚨</span>` : ""}</div>
    </div>
    ${rem ? `<div class="rappel">🔁 Audit du ${fmtDate(rem.date)} : ${esc(rem.note || "point non conforme")}</div>` : ""}
    ${q.crit && defaut && !photos.length && noteVal.trim().length < 15 ? `<button class="critphoto" data-action="add-cam" data-qid="${q.id}">📸 Photo requise pour cette non-conformité critique — appuyez ici</button>` : ""}
    <div class="seg">
      <button class="b b-oui ${a === "oui" ? "sel" : ""}" data-action="answer" data-qid="${q.id}" data-v="oui">👍 <span>Oui</span></button>
      <button class="b b-non ${a === "non" ? "sel" : ""}" data-action="answer" data-qid="${q.id}" data-v="non">👎 <span>Non</span></button>
      <button class="b b-na ${a === "na" ? "sel" : ""}" data-action="answer" data-qid="${q.id}" data-v="na"><span>N/A</span></button>
    </div>
    ${q.mesure ? `
    <div class="mesure">
      <input class="mesv" data-qid="${q.id}" type="number" step="0.1" inputmode="decimal"
        placeholder="__ ${q.mesure.unite}" value="${esc(mesv)}">
      <span>relevé ${q.mesure.sens === "min" ? "≥ " + q.mesure.seuil : "≤ " + q.mesure.seuil} ${q.mesure.unite} — bascule auto Oui/Non</span>
    </div>` : ""}
    <div class="noterow ${defaut || noteVal ? "" : "hide"}">
      <textarea class="note" data-qid="${q.id}"
        placeholder="Commentaire / constat…">${esc(noteVal)}</textarea>
      ${VocalDispo ? `<button class="mic" data-action="dictee" data-qid="${q.id}" title="Dicter le constat">🎙️</button>` : ""}
    </div>
    <div class="tags ${defaut || noteVal ? "" : "hide"}">
      ${tagsList.map((t) => `<button class="tag" data-action="tag" data-qid="${q.id}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}
    </div>
    <div class="actrow ${defaut ? "" : "hide"}">
      <div class="chipgrp"><span class="chiplab">Quand :</span>
        ${echeances.map(([lab, n]) =>
          `<button class="qchip ${act.echeance === lab ? "sel" : ""}" data-action="act-quand" data-qid="${q.id}" data-lab="${lab}" data-n="${n}">${lab}</button>`).join("")}
      </div>
    </div>
    <div class="phrow" id="ph-${q.id}">
      ${photos.map((p, i) => `
        <span class="phwrap">
          <img class="ph" src="${p}" data-action="view-photo" data-qid="${q.id}" data-i="${i}" alt="photo">
          <button class="phdel" data-action="del-photo" data-qid="${q.id}" data-i="${i}" aria-label="Supprimer">×</button>
        </span>`).join("")}
      <button class="addph" data-action="add-photo" data-qid="${q.id}">🖼️ Galerie</button>
      <button class="addph" data-action="add-cam" data-qid="${q.id}">📸 Appareil photo</button>
    </div>
  </div>`;
}
function renderAudit(){
  const audit = current;
  if(!audit){ state.view = "list"; return render(); }
  const sec = SECTIONS[state.sec];
  const gs = globalStats(audit);
  const st = sectionStats(sec, audit);
  const gic = interp(gs.score);
  const sic = st.score === null ? { color:"#94a3b8" } : interp(st.score);
  const modeFocus = !!reglages().focus;
  if(modeFocus) state.fq = Math.max(0, Math.min(sec.questions.length - 1, state.fq));

  let chips = "";
  SECTIONS.forEach((s, i) => {
    const sti = sectionStats(s, audit);
    chips += `<button class="chip ${i === state.sec ? "active" : ""} ${sti.done === sti.total ? "done" : ""}" id="chip-${i}"
      data-action="goto-section" data-i="${i}"><span>${s.icon}</span><span>${esc(s.short)}</span>
      <span class="cnt">${sti.done}/${sti.total}</span></button>`;
  });

  let cards = "";
  if(modeFocus){
    const q = sec.questions[state.fq];
    cards = qCardHtml(q, state.fq + 1, audit);
  } else {
    let num = 0;
    for(const q of sec.questions){
      num++;
      const reponse = audit.answers[q.id] || "";
      const nonConforme = reponse === (q.inv ? "oui" : "non");
      if(state.filtre === "arep" && reponse !== "") continue;
      if(state.filtre === "nc" && !nonConforme) continue;
      cards += qCardHtml(q, num, audit);
    }
  }

  const prev = state.sec > 0 ? SECTIONS[state.sec - 1] : null;
  const next = state.sec < SECTIONS.length - 1 ? SECTIONS[state.sec + 1] : null;
  const footer = modeFocus ? `
  <div class="footerbar noprint"><div class="fb-in">
    <button class="fbtn ghost" data-action="fq" data-d="-1" ${state.fq === 0 ? "disabled" : ""}>◀ Précédente</button>
    <span class="fpos">${state.fq + 1}/${sec.questions.length}</span>
    ${state.fq < sec.questions.length - 1
      ? `<button class="fbtn primary" data-action="fq" data-d="1">Suivante ▶</button>`
      : (next ? `<button class="fbtn primary" data-action="goto-section" data-i="${state.sec + 1}">Section suivante →<small>${esc(next.short)}</small></button>`
              : `<button class="fbtn primary" data-action="open-report-current">📊 Rapport<small>score final</small></button>`)}
  </div></div>` : `
  <div class="footerbar noprint"><div class="fb-in">
    ${prev ? `<button class="fbtn ghost" data-action="goto-section" data-i="${state.sec - 1}">← Section précédente<small>${esc(prev.short)}</small></button>` : `<button class="fbtn ghost" data-action="back-home">🏠 Accueil</button>`}
    ${next ? `<button class="fbtn primary" data-action="goto-section" data-i="${state.sec + 1}">Section suivante →<small>${esc(next.short)}</small></button>`
           : `<button class="fbtn primary" data-action="open-report-current">📊 Voir le rapport<small>score final</small></button>`}
  </div></div>`;

  app.innerHTML = `
  <div class="topbar noprint">
    <div class="tb-in">
      <button class="tb-back" data-action="back-home">←</button>
      <div class="tb-title" data-action="edit-info" style="cursor:pointer;">
        <b>${esc(audit.restaurant || "Audit")}</b>
        <small>${fmtDate(audit.date)} · ${esc(audit.auditor || "")} ${audit.auditor ? "·" : ""} <u>modifier</u></small>
      </div>
      <span class="scorechip" id="hScore" style="background:${gic.color};">${gs.score === null ? "—" : Math.round(gs.score) + "%"}</span>
      <button class="tb-back" data-action="open-report-current" title="Voir le rapport">📊</button>
    </div>
    <div class="progress"><i id="hBar" style="width:${gs.pct}%;"></i></div>
    <div class="savestate" id="saveState">✓ Enregistré</div>
  </div>
  <div class="chips noprint">${chips}</div>
  <div class="wrap">
    <div class="sec-head">
      <h2>${sec.icon} ${esc(sec.title)}</h2>
      <button class="toutoui" data-action="toutoui" title="Tout pré-cocher Oui, puis corriger les Non">✓ Tout Oui</button>
      <span class="scorechip" id="secScore" style="background:${sic.color};">${st.score === null ? "—" : Math.round(st.score) + "%"}</span>
    </div>
    <div class="sec-bar"><i id="secBar" style="width:${st.pct}%;"></i></div>
    <div class="sec-warn hide" id="secWarn">⚠️ ${st.total - st.done} question(s) sans réponse dans cette section</div>
    ${sec.questions.some((q) => q.crit && audit.answers[q.id] === (q.inv ? "oui" : "non"))
      ? `<div class="crit-banner">🚨 Non-conformité critique HACCP dans cette section</div>` : ""}
    ${modeFocus ? "" : `<div class="navrow noprint">
      <button class="navchip ${(state.filtre || "tout") === "tout" ? "active" : ""}" data-action="filtre" data-v="tout">Tout</button>
      <button class="navchip ${state.filtre === "arep" ? "active" : ""}" data-action="filtre" data-v="arep">À répondre</button>
      <button class="navchip ${state.filtre === "nc" ? "active" : ""}" data-action="filtre" data-v="nc">Non conformes</button>
    </div>`}
    ${cards}
  </div>
  ${footer}`;

  const sw = document.getElementById("secWarn");
  if(sw && st.done < st.total) sw.classList.remove("hide");

  window.scrollTo(0, 0);
  if(!modeFocus && state.autoJump){
    const target = sec.questions.find(q => !audit.answers[q.id]);
    if(target){
      setTimeout(() => {
        const el = app.querySelector(`.qcard[data-qid="${target.id}"]`);
        if(el) el.scrollIntoView({ block:"center" });
      }, 60);
    }
  }
}

function updateLive(){
  if(!current) return;
  const gs = globalStats(current);
  const chip = document.getElementById("hScore");
  if(chip){
    if(gs.score === null){ chip.textContent = "—"; chip.style.background = "#94a3b8"; }
    else { chip.textContent = Math.round(gs.score) + "%"; chip.style.background = interp(gs.score).color; }
  }
  const bar = document.getElementById("hBar");
  if(bar) bar.style.width = gs.pct + "%";
  SECTIONS.forEach((s, i) => {
    const el = document.getElementById("chip-" + i);
    if(!el) return;
    const sti = sectionStats(s, current);
    const c = el.querySelector(".cnt");
    if(c) c.textContent = sti.done + "/" + sti.total;
    el.classList.toggle("done", sti.done === sti.total);
  });
  if(SECTIONS[state.sec]){
    const st = sectionStats(SECTIONS[state.sec], current);
    const ss = document.getElementById("secScore");
    if(ss){
      if(st.score === null){ ss.textContent = "—"; ss.style.background = "#94a3b8"; }
      else { ss.textContent = Math.round(st.score) + "%"; ss.style.background = interp(st.score).color; }
    }
    const sb = document.getElementById("secBar");
    if(sb) sb.style.width = st.pct + "%";
    const sw = document.getElementById("secWarn");
    if(sw) sw.classList.toggle("hide", st.done === st.total);
  }
}

/* ---------- Rapport ---------- */
function renderReport(){

  const gs = globalStats(audit);

  const r = 54, circ = 2 * Math.PI * r;
  const off = gs.score === null ? circ : circ * (1 - gs.score / 100);
  const logo = reglages().logo;
  const critiques = criticalsNC(audit);

  let secRows = "";
  SECTIONS.forEach((s, i) => {
    const st = gs.parts[i];
    const col = st.score === null ? "#94a3b8" : interp(st.score).color;
    secRows += `
    <div class="secrow">
      <div class="sr-top">
        <b>${s.icon} ${esc(s.title)}</b>
        ${st.na ? `<span class="meta">${st.na} N/A</span>` : ""}

  <div class="wrap">
    ${critiques.length ? `<div class="crit-banner">🚨 ${critiques.length} non-conformité${critiques.length > 1 ? "s" : ""} critique${critiques.length > 1 ? "s" : ""} HACCP — action immédiate requise, quel que soit le score global</div>` : ""}
    <div class="rep-hero">
      ${logo ? `<img class="rep-logo" src="${logo}" alt="logo">` : ""}

        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="13"/>
          <circle cx="75" cy="75" r="${r}" fill="none" stroke="${ic.color}" stroke-width="13"
            stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="gval"><b style="color:${ic.color};">${gs.score === null ? "—" : Math.round(gs.score) + "%"}</b>
        <small>${gs.done}/${TOTAL_Q} questions</small></div>
      </div>
      <div class="interp" style="background:${ic.color};">${ic.label}</div>
      ${gs.veto ? `<div class="meta" style="margin-top:8px; color:var(--bad); font-weight:700;">⚖️ ${esc(gs.veto)}${gs.scoreBrut !== null ? " — score brut : " + Math.round(gs.scoreBrut) + " %" : ""}</div>` : ""}
      ${gs.done < TOTAL_Q ? `<div class="meta" style="margin-top:8px;">⚠️ Audit incomplet : score calculé sur les réponses saisies</div>` : ""}

    ${(audit.startedAt && audit.completedAt) ? `<p class="rep-meta">⏱️ Audit réalisé de ${new Date(audit.startedAt).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" })} à ${new Date(audit.completedAt).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" })} (${Math.floor((audit.completedAt - audit.startedAt) / 3600000)} h ${String(Math.round((audit.completedAt - audit.startedAt) % 3600000 / 60000)).padStart(2, "0")})</p>` : ""}

function posSur(cv, e){
  const rect = cv.getBoundingClientRect();
  return { x:(e.clientX - rect.left) * cv.width / rect.width, y:(e.clientY - rect.top) * cv.height / rect.height };
}
function initSignatures(audit){
  document.querySelectorAll(".sigpad").forEach((cv) => {
    const role = cv.dataset.role;
    const ctx = cv.getContext("2d");
    ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#0f172a";
    const sig = (audit.signatures || {})[role];
    if(sig){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, cv.width, cv.height); img.src = sig; }
    let dessine = false;
    cv.onpointerdown = (e) => {
      dessine = true;
      const pos = posSur(cv, e);
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    };
    cv.onpointermove = (e) => {
      if(!dessine) return;
      const pos = posSur(cv, e);
      ctx.lineTo(pos.x, pos.y); ctx.stroke();
    };
    cv.onpointerup = () => {
      if(!dessine) return;
      dessine = false;
      audit.signatures = audit.signatures || {};
      audit.signatures[role] = cv.toDataURL("image/png");
      scheduleSave();
    };
  });
}

function renderSuivi(){
  if(!state.suiviResto){ const r = restosUniques(); state.suiviResto = r[0] || null; }
  const tab = state.suiviTab;
  let corps = "";
  const chipsRestos = restosUniques().map((r) =>
    `<button class="chip ${r === state.suiviResto ? "active" : ""}" data-action="suivi-resto" data-r="${esc(r)}">${esc(r)}</button>`).join("");

  if(tab === "evolution"){
    const audits = cache.filter((a) => (a.restaurant || "").trim() === state.suiviResto)
      .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.createdAt || 0) - (b.createdAt || 0));
    if(!audits.length){
      corps = `<div class="navrow">${chipsRestos}</div><div class="card"><div class="empty">Aucun audit pour ce restaurant.</div></div>`;
    } else {
      const serie = audits.map((a) => { const g = globalStats(a);
        return { label:dateCourt(a.date), val:g.score === null ? null : Math.round(g.score * 10) / 10 }; });
      const courbe = `<div class="card"><h3>Score global dans le temps</h3>${svgLigne(serie, (v) => Math.round(v) + " %")}</div>`;
      let delta = "";
      if(audits.length >= 2){
        const anc = audits[audits.length - 2], rec = audits[audits.length - 1];
        const rows = SECTIONS.map((s) => {
          const s1 = sectionStats(s, anc).score, s2 = sectionStats(s, rec).score;
          if(s1 === null || s2 === null) return "";
          const d = s2 - s1;
          return `<div class="pl-item"><span style="flex:1;">${s.icon} ${esc(s.short)}</span>
            <span><b>${Math.round(s1)} %</b> → <b>${Math.round(s2)} %</b></span>
            <span class="${d >= 0 ? "up" : "down"}" style="font-weight:800;">${d >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(d))}</span></div>`;
        }).join("");
        delta = `<div class="card"><h3>Évolution par section</h3><p class="meta" style="margin:0 2px 8px;">${fmtDate(anc.date)} → ${fmtDate(rec.date)}</p>${rows}</div>`;
      }
      const liste = audits.map((a) => { const g = globalStats(a); const ic2 = interp(g.score);
        return `<div class="pl-item"><span style="flex:1;">${fmtDate(a.date)}${a.suiviDe ? " 🔁" : ""}</span><span class="meta">${g.done}/${TOTAL_Q} répondues</span>
          <span class="scorechip" style="background:${ic2.color};">${g.score === null ? "—" : Math.round(g.score) + "%"}</span></div>`; }).join("");
      corps = `<div class="navrow">${chipsRestos}</div>` + courbe + delta +
        `<div class="card"><h3>${audits.length} audit(s) — ${esc(state.suiviResto || "")}</h3>${liste}</div>`;
    }
  }
  else if(tab === "comparaison"){
    const restos = restosUniques();
    const dernierScore = (r) => {
      const list = cache.filter((a) => (a.restaurant || "").trim() === r)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      return list.length ? globalStats(list[0]).score : null;
    };
    const barres = restos.map((r) => ({ label:r, val:dernierScore(r) === null ? null : Math.round(dernierScore(r)) }))
      .sort((a, b) => (b.val === null ? -1 : b.val) - (a.val === null ? -1 : a.val));
    corps = `<div class="card"><h3>Dernier score par restaurant</h3>${svgBarresH(barres, (v) => Math.round(v) + " %")}</div>
      <div class="card">${restos.map((r) => {
        const audits = cache.filter((a) => (a.restaurant || "").trim() === r);
        const sc = dernierScore(r);
        const ic2 = interp(sc);
        return `<div class="pl-item" data-action="suivi-resto" data-r="${esc(r)}" style="cursor:pointer;">
          <span style="flex:1;">${esc(r)}</span><span class="meta">${audits.length} audit(s) · touchez pour l'évolution</span>
          <span class="scorechip" style="background:${ic2.color};">${sc === null ? "—" : Math.round(sc) + "%"}</span></div>`;
      }).join("")}</div>`;
  }
  else if(tab === "groupe"){
    const moisMap = {};
    cache.forEach((a) => { const k = (a.date || "").slice(0, 7); if(k) moisMap[k] = true; });
    const mois = Object.keys(moisMap).sort().reverse();
    if(!state.grpMois || !mois.includes(state.grpMois)) state.grpMois = mois[0] || null;
    const chipsMois = mois.map((k) => {
      const d = new Date(k + "-01T12:00:00");
      return `<button class="chip ${k === state.grpMois ? "active" : ""}" data-action="grp-mois" data-k="${k}">${d.toLocaleDateString("fr-FR", { month:"long", year:"numeric" })}</button>`;
    }).join("");
    const audits = cache.filter((a) => (a.date || "").slice(0, 7) === state.grpMois);
    const scores = audits.map((a) => globalStats(a).score).filter((s) => s !== null);
    const moy = scores.length ? Math.round(scores.reduce((x, y) => x + y, 0) / scores.length) : null;
    const parResto = {};
    audits.forEach((a) => {
      const r = (a.restaurant || "?").trim();
      if(!parResto[r] || (a.updatedAt || 0) > (parResto[r].updatedAt || 0)) parResto[r] = a;
    });
    const barres = Object.keys(parResto).map((r) => {
      const g = globalStats(parResto[r]);
      return { label:r, val:g.score === null ? null : Math.round(g.score) };
    }).sort((a, b) => (b.val === null ? -1 : b.val) - (a.val === null ? -1 : a.val));
    const faib = {};

    }));
    const topFaibles = Object.keys(faib).map((k) => ({ label:k, val:faib[k] })).sort((a, b) => b.val - a.val).slice(0, 3);
    corps = `<div class="navrow">${chipsMois}</div>

      ${topFaibles.length ? `<div class="card"><h3>Points « Non » les plus fréquents du mois</h3>${svgBarresH(topFaibles, (v) => String(v))}</div>` : ""}`;
  }

  app.innerHTML = `

    <button class="tb-back" data-action="back-home">←</button>

  window.scrollTo(0, 0);
}

let annCv = null, annCtx = null, annBase = null, annOutil = "stylo", annTraits = [], annTrace = null;
function annRedessiner(){
  annCtx.clearRect(0, 0, annCv.width, annCv.height);
  annCtx.drawImage(annBase, 0, 0, annCv.width, annCv.height);
  const tout = annTrace ? annTraits.concat([annTrace]) : annTraits;
  for(const t of tout){
    if(t.outil === "surligne"){
      annCtx.strokeStyle = "rgba(255,214,10,.45)";
      annCtx.lineWidth = 30;
    } else {
      annCtx.strokeStyle = "#dc2626";
      annCtx.lineWidth = 5;
    }
    annCtx.lineCap = "round"; annCtx.lineJoin = "round";
    const pts = t.points;
    if(pts.length < 2){
      annCtx.beginPath();
      annCtx.arc(pts[0].x, pts[0].y, t.outil === "surligne" ? 15 : 3, 0, 7);
      annCtx.fillStyle = annCtx.strokeStyle;
      annCtx.fill();
      continue;
    }
    annCtx.beginPath();
    annCtx.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++) annCtx.lineTo(pts[i].x, pts[i].y);
    annCtx.stroke();
    if(t.outil === "fleche" && pts.length >= 2){
      const p1 = pts[pts.length - 2], p2 = pts[pts.length - 1];
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const L = 24;
      annCtx.beginPath();
      annCtx.moveTo(p2.x, p2.y);
      annCtx.lineTo(p2.x - L * Math.cos(ang - 0.45), p2.y - L * Math.sin(ang - 0.45));
      annCtx.lineTo(p2.x - L * Math.cos(ang + 0.45), p2.y - L * Math.sin(ang + 0.45));
      annCtx.closePath();
      annCtx.fillStyle = annCtx.strokeStyle;
      annCtx.fill();
    }
  }
}
function openAnnotateur(qid, i){
  const p = current.photos[qid][i];
  overlay.innerHTML = `<div class="viewer">
    <canvas id="annCv"></canvas>
    <div class="outils noprint">
      <button class="outil sel" data-action="ann-outil" data-t="stylo">✏️ Stylo</button>
      <button class="outil" data-action="ann-outil" data-t="fleche">➡️ Flèche</button>
      <button class="outil" data-action="ann-outil" data-t="surligne">🟡 Surligneur</button>
      <button class="outil" data-action="ann-undo">↩️ Annuler trait</button>
    </div>
    <p style="color:#cbd5e1; font-size:12.5px; margin:8px 0 0;">Stylo rouge libre · Flèche : glissez vers le défaut · Surligneur : passez sur la DLC sans la masquer</p>
    <div class="viewer-actions">
      <button class="btn primary" data-action="ann-save" data-qid="${qid}" data-i="${i}">✓ Enregistrer</button>
      <button class="btn ghost" data-action="ann-back" data-qid="${qid}" data-i="${i}" style="background:#fff;">Annuler</button>
    </div></div>`;
  overlay.style.display = "block";
  annCv = document.getElementById("annCv");
  annCtx = annCv.getContext("2d");
  annTraits = []; annTrace = null; annOutil = "stylo";
  const img = new Image();
  img.onload = () => {
    const maxW = Math.min(window.innerWidth - 24, 900);
    const scale = Math.min(1, maxW / img.naturalWidth);
    annCv.width = Math.max(1, Math.round(img.naturalWidth * scale));
    annCv.height = Math.max(1, Math.round(img.naturalHeight * scale));
    annBase = img;
    annRedessiner();
    annCv.onpointerdown = (e) => {
      const pt = posSur(annCv, e);
      if(annOutil === "fleche") annTrace = { outil:"fleche", points:[pt, pt] };
      else annTrace = { outil:annOutil, points:[pt] };
      try{ annCv.setPointerCapture(e.pointerId); }catch(err){}
      annRedessiner();
    };
    annCv.onpointermove = (e) => {
      if(!annTrace) return;
      const pt = posSur(annCv, e);
      if(annTrace.outil === "fleche") annTrace.points = [annTrace.points[0], pt];
      else annTrace.points.push(pt);
      annRedessiner();
    };
    annCv.onpointerup = (e) => {
      if(!annTrace) return;
      if(annTrace.outil === "fleche") annTrace.points = [annTrace.points[0], posSur(annCv, e)];
      annTraits.push(annTrace);
      annTrace = null;
      annRedessiner();
    };
  };
  img.src = p;
}
async function cloudToutSynchro(){
  const cle = reglages().cle || CLE_CLOUD_DEFAUT;
  const distants = await cloudLister();
  let pousses = 0, importes = 0;
  const locaux = {};
  cache.forEach((a) => locaux[a.id] = a);
  for(const a of cache){
    const dist = distants.find((x) => x.id === a.id);
    const majDist = dist ? Date.parse(dist.maj) || 0 : 0;
    if(!dist || (a.updatedAt || 0) > majDist){
      let complet = a;
      if(db){ const c = await dbGet(a.id); if(c) complet = c; }
      await cloudPost(cle, complet);
      pousses++;
    }
  }
  for(const e of distants){
    const loc = locaux[e.id];
    const majDist = Date.parse(e.maj) || 0;
    if(!loc || majDist > (loc.updatedAt || 0)){
      const audit = await cloudCharger(e.id);
      audit.actions = audit.actions || {};
      await dbPut(audit);
      importes++;
    }
  }
  cache = await dbAllLege();
  return { pousses, importes };
}
async function cloudRestaurer(){
  try{
    toast("Recherche des sauvegardes…");
    const liste = await cloudLister();
    if(!liste.length){
      showModal(`<h3>☁️ Restaurer</h3><div class="empty">Aucune sauvegarde dans votre Drive pour l'instant.</div>
        <button class="btn primary block" data-action="close-modal">Fermer</button>`);
      return;
    }
    showModal(`<h3>☁️ Sauvegardes dans votre Drive</h3>
      ${liste.map((a) => `
        <div class="pl-item"><span style="flex:1; min-width:0;"><b style="font-size:13.5px;">${esc(a.restaurant || "?")}</b>
        <span class="meta" style="display:block;">${esc(a.date || "?")} · ${Math.round((a.taille || 0) / 1024)} Ko</span></span>
        <button class="btn ghost" data-action="cloud-import" data-id="${esc(a.id)}" style="min-height:38px; padding:8px 12px;">Importer</button></div>`).join("")}
      <button class="btn primary block" data-action="close-modal" style="margin-top:10px;">Fermer</button>`);
  }catch(e){ toast("Erreur : " + e.message); }
}

document.body.addEventListener("click", async (e) => {

    if(db){ const complet = await dbGet(el.dataset.id); if(complet) rec = complet; }
    rec.actions = rec.actions || {};

    if(act === "open-report"){ state.view = "report"; render(); return; }
    state.view = "audit"; state.autoJump = true;
    state.sec = SECTIONS.findIndex(s => sectionStats(s, rec).done < s.questions.length);

  else if(act === "dup-audit"){

    const rec = { id:newId(), restaurant:src.restaurant, auditor:src.auditor, date:todayISO(),
      createdAt:Date.now(), updatedAt:Date.now(), answers:{}, notes:{}, photos:{}, actions:{} };
    cache.push(rec);

  }

  }
  else if(act === "reparer"){
    try{
      if(navigator.serviceWorker){
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r2) => r2.unregister()));
      }
      if(window.caches){ caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))); }
    }catch(e){}

    setTimeout(() => location.reload(), 900);

    const noterow = card.querySelector(".noterow");
    if(noterow) noterow.classList.remove("hide");
    const note = card.querySelector(".note");
    const rec = new SR();
    rec.lang = "fr-FR"; rec.interimResults = false; rec.continuous = true;
    el.classList.add("ecoute");
    window._dictee = { qid, rec, btn: el };
    rec.onresult = (ev) => {
      let texte = "";
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        if(ev.results[i].isFinal) texte += ev.results[i][0].transcript;
      }
      if(texte){
        note.value = note.value ? note.value + " " + texte.trim() : texte.trim();
        if(current){ current.notes[qid] = note.value; scheduleSave(); }
      }
    };
    rec.onerror = () => { el.classList.remove("ecoute"); toast("Dictée interrompue — réessayez"); };
    rec.onend = () => { el.classList.remove("ecoute"); if(window._dictee && window._dictee.qid === qid) window._dictee = null; };
    try{ rec.start(); }catch(e){ el.classList.remove("ecoute"); toast("Dictée indisponible"); }
  }
  else if(act === "fq"){
    state.fq = Math.max(0, Math.min(SECTIONS[state.sec].questions.length - 1, state.fq + parseInt(el.dataset.d, 10)));
    renderAudit();
  }
  else if(act === "vetocrit"){
    const r = reglages();
    r.vetocrit = el.dataset.v;
    saveReglages(r);
    el.parentNode.querySelectorAll(".vetochip").forEach((b) => b.classList.toggle("sel", b.dataset.v === r.vetocrit));
    toast("Règle critique : " + el.textContent);
  }
  else if(act === "suivi-tab"){ state.suiviTab = el.dataset.t; renderSuivi(); }
  else if(act === "suivi-resto"){ state.suiviResto = el.dataset.r; state.suiviTab = "evolution"; renderSuivi(); }
  else if(act === "grp-mois"){ state.grpMois = el.dataset.k; renderSuivi(); }
  else if(act === "grille-sec"){ state.grilleSec = parseInt(el.dataset.i, 10); renderGrille(); }
  else if(act === "grille-add"){
    const txt = document.getElementById("cqText").value.trim();
    if(!txt){ toast("Écrivez la question d'abord"); return; }
    const r = reglages();
    r.grille = r.grille || [];
    r.grille.push({ sec:state.grilleSec, t:txt, id:"cx" + Date.now().toString(36) });
    saveReglages(r);
    appliquerGrillePerso();
    renderGrille();
    toast("Question ajoutée ✓");
  }
  else if(act === "grille-del"){
    const r = reglages();
    r.grille = (r.grille || []).filter((p) => p.id !== el.dataset.id);
    saveReglages(r);
    appliquerGrillePerso();
    renderGrille();
  }
});

// Champs de saisie (commentaires)
app.addEventListener("input", (e) => {
  const t = e.target;
  if(!current) return;
  if(t.classList && t.classList.contains("note")){
    current.notes[t.dataset.qid] = t.value;
    scheduleSave();
  }

});
document.body.addEventListener("change", (e) => {
  const t = e.target;
  if(t.id === "fLogo" && t.files && t.files[0]){
    const url = URL.createObjectURL(t.files[0]);
    const img = new Image();
    img.onload = () => {
      const r = reglages();
      r.logo = compressImage(img, 300, 0.8);
      saveReglages(r);
      URL.revokeObjectURL(url);
      modalReglages();
      toast("Logo enregistré ✓");
    };
    img.src = url;
  }
  else if(t.id === "fFocus"){
    const r = reglages();
    r.focus = t.checked;
    saveReglages(r);
    toast(t.checked ? "Mode focus activé ✓" : "Mode focus désactivé");
  }
  else if(t.classList && t.classList.contains("mesv")){
    if(!current.mesures) current.mesures = {};
    current.mesures[t.dataset.qid] = t.value;
    scheduleSave();
    appliquerMesure(t.dataset.qid);
  }
  else if(t.id === "fCleCloud"){
    const r = reglages();
    r.cle = t.value.trim();
    saveReglages(r);
    toast(r.cle ? "Clé enregistrée ✓" : "Clé effacée");
  }
  else if(t.id === "fAutoCloud"){
    const r = reglages();
    r.autoCloud = t.checked;
    saveReglages(r);
    toast(t.checked ? "Sauvegarde en ligne automatique activée ✓" : "Sauvegarde en ligne automatique désactivée");
  }
});

// Sélecteur de photos
function appliquerMesure(qid){
  const q = SECTIONS.flatMap((x) => x.questions).find((x) => x.id === qid);
  const m = q && q.mesure;
  if(!m || !current) return;
  const v = parseFloat(String(current.mesures[qid] || "").replace(",", "."));
  if(isNaN(v)) return;
  const conforme = m.sens === "min" ? v >= m.seuil : v <= m.seuil;
  current.answers[qid] = conforme ? "oui" : "non";
  let note = (current.notes[qid] || "").replace(/\s*—?\s*Mesuré\s*:\s*[^—]*$/i, "").trim();
  note = (note ? note + " — " : "") + "Mesuré : " + v.toLocaleString("fr-FR") + " " + m.unite + (conforme ? "" : " (limite " + m.seuil + " " + m.unite + ")");
  current.notes[qid] = note;
  scheduleSave(); renderAudit();
}
document.getElementById("photoInput").addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);
  if(files.length && e.target.dataset.qid) addPhotos(e.target.dataset.qid, files);
});
document.getElementById("camInput").addEventListener("change", (e) => {
  const files = Array.from(e.target.files || []);
  if(files.length && e.target.dataset.qid) addPhotos(e.target.dataset.qid, files);
});

// Import de sauvegarde
document.getElementById("importInput").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f || !db) return;
  try{
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : (data.exports || []);
    let n = 0;
    for(const rec of list){
      if(!rec || !rec.id || typeof rec.answers !== "object") continue;
      rec.photos = rec.photos || {}; rec.notes = rec.notes || {};
      await dbPut(rec); n++;
    }
    cache = await dbAll();
    renderList();
    toast(n + " audit(s) importé(s) ✓");
  }catch(err){ console.error(err); toast("Fichier de sauvegarde invalide"); }
});

// Fermeture des surcouches
overlay.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if(!el){ return; }
  const act = el.dataset.action;
  if(act === "modal-bg"){
    if(e.target === el) closeModal();   // clic direct sur le fond, pas à l'intérieur de la fenêtre
    return;
  }
  if(act === "close-viewer" || act === "del-photo-viewer"){
    if(act === "del-photo-viewer" && state.viewer && current){
      const { qid, i } = state.viewer;
      current.photos[qid].splice(i, 1);
      if(!current.photos[qid].length) delete current.photos[qid];
      scheduleSave(); renderPhotoRow(qid);
    }
    state.viewer = null;
    overlay.innerHTML = ""; overlay.style.display = "none";
  }
});

/* ---------- Démarrage ---------- */
window.onerror = function(msg, source, ligne){
  try{
    const el = document.getElementById("app");
    if(el && el.innerHTML.length < 50){
      el.innerHTML = '<div class="wrap" style="padding-top:30px;"><div class="card" style="border:2px solid var(--bad);">'
        + '<h3>⚠️ Erreur de démarrage</h3><p class="meta" style="word-break:break-all;">'
        + String(msg).replace(/</g, "&lt;") + ' (ligne ' + ligne + ')</p>'
        + '<p class="meta">📸 Envoyez une capture d\'écran pour correction — ou fermez tous les onglets du site puis rouvrez-le.</p></div></div>';
    }
  }catch(e){}
};
(async function init(){
  try{
    const ok = await openDB();
    if(!ok){
      app.innerHTML = `<div class="wrap"><div class="home-head"><h1>🧑‍🍳 Audit Cuisine</h1></div>
        <div class="card">⚠️ Le stockage local n'est pas disponible dans ce navigateur.
        Ouvrez ce fichier dans Safari ou Chrome.</div></div>`;
      return;
    }
    cache = await dbAllLege();
    cache.forEach((a) => { a.actions = a.actions || {}; });
    appliquerGrillePerso();
    if(!reglages().cle){ const r = reglages(); r.cle = CLE_CLOUD_DEFAUT; saveReglages(r); }
    renderList();
  }catch(e){
    const el = document.getElementById("app");
    if(el) el.innerHTML = '<div class="wrap" style="padding-top:30px;"><div class="card" style="border:2px solid var(--bad);"><h3>⚠️ Erreur de démarrage</h3><p class="meta" style="word-break:break-all;">'
      + String(e && e.stack || e).replace(/</g, "&lt;").slice(0, 300) + '</p></div></div>';
  }
})();

// Glissement gauche/droite en mode focus
let tX = null;
app.addEventListener("touchstart", (e) => { tX = e.touches[0].clientX; }, { passive:true });
app.addEventListener("touchend", (e) => {
  if(tX === null) return;
  const dx = e.changedTouches[0].clientX - tX;
  tX = null;
  if(state.view !== "audit" || !reglages().focus) return;
  if(Math.abs(dx) < 60) return;
  const qs = SECTIONS[state.sec].questions;
  state.fq = Math.max(0, Math.min(qs.length - 1, state.fq + (dx < 0 ? 1 : -1)));
  renderAudit();
}, { passive:true });
</script>
